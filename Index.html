<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unique Twelve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="dark"]{--bg:#070b18;--b1:#3b5bfd;--b2:#a64bff;--b3:#00c2a8;--blob:.38;--card:rgba(255,255,255,.055);--modal:rgba(16,21,42,.92);--border:rgba(255,255,255,.1);--text:#e9edfb;--muted:#8d97b8;--accent:#6d8bff;--accent2:#b06bff;--on-accent:#fff;--good:#2fd47f;--warn:#ffb547;--bad:#ff5d73;--info:#38bdf8;--input:rgba(255,255,255,.06);--shadow:0 10px 40px rgba(0,0,0,.35);--blur:18px}
[data-theme="glass"]{--bg:#e6eaff;--b1:#8ea8ff;--b2:#f7a1d8;--b3:#7ee0d2;--blob:.75;--card:rgba(255,255,255,.48);--modal:rgba(255,255,255,.9);--border:rgba(255,255,255,.8);--text:#1d2340;--muted:#5d6588;--accent:#5b5bf0;--accent2:#d14fb3;--on-accent:#fff;--good:#11a35d;--warn:#d48806;--bad:#e0344f;--info:#0284c7;--input:rgba(255,255,255,.6);--shadow:0 10px 40px rgba(60,70,140,.16)}
[data-theme="royal"]{--bg:#061451;--b1:#1d4ed8;--b2:#3b2bbf;--b3:#f5c542;--blob:.4;--card:rgba(255,255,255,.07);--modal:rgba(10,28,96,.94);--border:rgba(255,255,255,.13);--text:#f1f4ff;--muted:#a4b1e3;--accent:#f5c542;--accent2:#ffa53b;--on-accent:#1a1400;--good:#3ee08f;--warn:#ffc04d;--bad:#ff6b81;--info:#7cc4ff;--input:rgba(255,255,255,.08);--shadow:0 10px 40px rgba(0,0,30,.45)}
[data-theme="emerald"]{--bg:#03140e;--b1:#0f9d6b;--b2:#045c45;--b3:#a3e635;--blob:.35;--card:rgba(255,255,255,.055);--modal:rgba(6,32,23,.94);--border:rgba(255,255,255,.1);--text:#e7fbf2;--muted:#86b3a2;--accent:#34d399;--accent2:#a3e635;--on-accent:#032016;--good:#4ade80;--warn:#fbbf24;--bad:#fb7185;--info:#67e8f9;--input:rgba(255,255,255,.06);--shadow:0 10px 40px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f3f5fa;--b1:#c7d2fe;--b2:#fbcfe8;--b3:#bae6fd;--blob:.0;--card:#ffffff;--modal:#ffffff;--border:#e3e7f0;--text:#18203a;--muted:#6b7491;--accent:#4f46e5;--accent2:#7c3aed;--on-accent:#fff;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0284c7;--input:#f6f7fb;--shadow:0 4px 18px rgba(20,30,70,.07);--blur:0px}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .5s,color .3s;font-size:14px}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;background:radial-gradient(38% 38% at 15% 20%,var(--b1),transparent 70%),radial-gradient(34% 34% at 85% 12%,var(--b2),transparent 70%),radial-gradient(40% 40% at 70% 92%,var(--b3),transparent 70%);opacity:var(--blob);filter:blur(50px);animation:drift 26s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg)}}
.glass{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);border-radius:18px;box-shadow:var(--shadow)}
.card{padding:18px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px}h2{font-size:16px;font-weight:700}h3{font-size:17px;font-weight:700}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* layout */
.side{width:252px;position:fixed;top:12px;bottom:12px;left:12px;display:flex;flex-direction:column;padding:18px 12px;z-index:60;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.brand b{font-size:16px;display:block;letter-spacing:-.2px}.brand small{color:var(--muted);font-size:11.5px}
.nav{flex:1;overflow:auto}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:12px 12px 6px;font-weight:700}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13.5px;position:relative;transition:all .2s;text-decoration:none;margin-bottom:2px}
.nav a:hover{color:var(--text);background:var(--input)}
.nav a.active{color:var(--text);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,transparent),transparent)}
.nav a.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.nav a .lk{margin-left:auto;opacity:.6}
.side-foot{border-top:1px solid var(--border);padding:12px 8px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent);margin-right:6px}
.main{margin-left:276px;padding:12px 18px 50px 0;min-width:0}
.top{position:sticky;top:12px;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:18px}
.top .ttl{flex:1;min-width:0}
.top .ttl h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.menu-btn{display:none}
.scrim{display:none}
@media(max-width:920px){.side{transform:translateX(-115%)}.side.open{transform:none}.main{margin-left:0;padding:10px 10px 50px}.icon-btn.menu-btn{display:inline-grid}.scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}.hide-sm{display:none!important}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:9px 15px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap;color:var(--text)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 55%,transparent);transform:translateY(-1px)}
.btn.ghost{background:var(--input);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.success{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:11px;display:inline-grid;place-items:center;background:var(--input);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}.icon-btn.sm svg{width:15px;height:15px}
input,select,textarea{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
select option{background:var(--modal);color:var(--text)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--input);border:1px solid var(--border)}
.chip.admin{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-paid{background:color-mix(in srgb,var(--good) 17%,transparent);color:var(--good)}
.b-late{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-unpaid{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.b-partial{background:color-mix(in srgb,var(--info) 17%,transparent);color:var(--info)}
.b-pending,.b-future,.b-na{background:var(--input);color:var(--muted)}
.b-acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

/* grids */
.view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(5){animation-delay:.2s}.view>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.view{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.view>.kpis:has(>.kpi:nth-child(6)){grid-template-columns:repeat(6,1fr)}@media(max-width:1350px){.view>.kpis:has(>.kpi:nth-child(6)){grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.kpis,.view>.kpis:has(>.kpi:nth-child(6)){grid-template-columns:1fr 1fr}.kpi .val{font-size:18px}}
.kpi{padding:16px;position:relative;overflow:hidden;transition:transform .25s}
.kpi:hover{transform:translateY(-3px)}
.kpi .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.4px}
.kpi .ft{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c,var(--accent)) 22%,transparent),transparent 70%)}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.g11{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g111{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1150px){.g21,.g11,.g111{grid-template-columns:1fr}}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.chart-box{position:relative;height:270px}
.chart-box.sm{height:230px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:180px}
.search{position:relative}.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}.search input{padding-left:34px}
.hero{padding:22px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--card)),color-mix(in srgb,var(--accent2) 14%,var(--card)))}
.hero h1{font-size:24px}
.prog{height:9px;border-radius:9px;background:var(--input);overflow:hidden;border:1px solid var(--border)}
.prog>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr{transition:background .15s}.tbl tbody tr:hover{background:var(--input)}
.tbl .r{text-align:right}.tbl tfoot td{font-weight:800;border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;flex:none;background:var(--c)}
.av.lg{width:64px;height:64px;border-radius:20px;font-size:22px}

/* members */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{padding:16px;cursor:pointer;transition:transform .25s,border-color .25s}
.mcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.mcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px}
.mcard .acts{display:flex;gap:8px;margin-top:14px}
.mcard .acts .btn{flex:1}
.mini-cal{display:flex;gap:3px;margin-top:12px}
.mini-cal i{flex:1;height:7px;border-radius:3px;background:var(--input)}
.mini-cal i.paid{background:var(--good)}.mini-cal i.late{background:var(--warn)}.mini-cal i.unpaid{background:var(--bad)}.mini-cal i.partial{background:var(--info)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.cal{grid-template-columns:repeat(3,1fr)}}
.cc{padding:11px;border-radius:14px;border:1px solid var(--border);background:var(--input);cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;min-height:88px;--c:var(--muted)}
.cc:hover{transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 30%,transparent)}
.cc b{font-size:13px}.cc .a{font-weight:800;font-size:14px;margin-top:6px}.cc .d{font-size:11px;color:var(--muted);margin-top:2px}
.cc .st{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.cc .st svg{width:13px;height:13px;stroke-width:3}
.cc.paid{--c:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--input));border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.cc.late{--c:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--input));border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.cc.unpaid{--c:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--input));border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.cc.partial{--c:var(--info);background:color-mix(in srgb,var(--info) 9%,var(--input));border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.cc.future,.cc.na{opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--input);border:1px solid var(--border);width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;font-family:inherit;padding:7px 14px;border-radius:9px;cursor:pointer;transition:all .2s;white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{padding:12px;border-radius:13px;background:var(--input);border:1px solid var(--border)}
.stat small{color:var(--muted);font-size:11.5px;font-weight:600}.stat div{font-weight:800;font-size:17px;margin-top:2px}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(3,6,20,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--modal);border:1px solid var(--border);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.45);transform:translateY(24px) scale(.95);transition:transform .35s cubic-bezier(.2,.9,.25,1.15)}
.modal.wide{width:min(980px,100%)}
.overlay.show .modal{transform:none}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--modal);z-index:2}
.modal-body{padding:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.fld.full{grid-column:1/-1}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* misc */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:13px;background:var(--modal);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-weight:600;font-size:13px;animation:tin .35s cubic-bezier(.2,.9,.25,1.2);border-left:4px solid var(--good)}
.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
.loader{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--input);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);background-size:200% 100%;animation:bz 1s linear infinite;display:none}
.busy.on{display:block}@keyframes bz{to{background-position:-200% 0}}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:11px;transition:background .15s}
.li:hover{background:var(--input)}
.li .grow{flex:1;min-width:0}.li .grow b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .grow small{color:var(--muted);font-size:11.5px}
.tico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.tico.in{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tico.out{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tico.tr{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.empty{text-align:center;padding:36px 10px;color:var(--muted)}
.bcard{padding:18px;position:relative;overflow:hidden;transition:transform .25s}
.bcard:hover{transform:translateY(-3px)}
.bcard .bal{font-size:24px;font-weight:800;margin:10px 0 4px;letter-spacing:-.4px}
.bcard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.bcard .acts{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.theme-pop{position:absolute;top:calc(100% + 8px);right:0;padding:10px;display:none;flex-direction:column;gap:4px;min-width:200px;z-index:80;background:var(--modal)}
.theme-pop.on{display:flex;animation:rise .25s both}
.theme-pop button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--text);font-weight:600;font-size:13px;font-family:inherit;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left}
.theme-pop button:hover,.theme-pop button.on{background:var(--input)}
.sw{width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.4)}
.admin-only{display:none!important}
body.admin .admin-only{display:inline-flex!important}
body.admin .admin-block.admin-only{display:block!important}

 2h-2M6 14h12v8H6z',swap:'M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3',palette:'M12 2a10 10 0 1 0 0 20c1 0 1.5-.8 1.5-1.5 0-.4-.2-.8-.4-1-.3-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16a6 6 0 0 0 6-6c0-5-4.5-9-10-9zM7.5 11h.01M10.5 7h.01M15.5 7h.01',search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',logout:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',arrowIn:'M12 5v14M19 12l-7 7-7-7',arrowOut:'M12 19V5M5 12l7-7 7 7',db:'M12 8c4.4 0 8-1.3 8-3s-3.6-3-8-3-8 1.3-8 3 3.6 3 8 3zM4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',pie:'M21.2 15.9A10 10 0 1 1 8 2.8M22 12A10 10 0 0 0 12 2v10z',user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'};
const icon=(n,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24"><path d="${IC[n]||''}"/></svg>`;

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TK=n=>(n<0?'-':'')+'৳'+Math.round(Math.abs(+n||0)).toLocaleString('en-IN');
const TKs=n=>{n=+n||0;const a=Math.abs(n);const s=a>=1e7?(a/1e7).toFixed(2)+' Cr':a>=1e5?(a/1e5).toFixed(2)+' L':a>=1e3?(a/1e3).toFixed(1)+'K':Math.round(a);return (n<0?'-':'')+'৳'+s};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const curMonth=()=>todayStr().slice(0,7);
function addMonth(m,n){let[y,mo]=m.split('-').map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+'-'+pad(mo)}
function monthsBetween(a,b){const r=[];let m=a;let g=0;while(m<=b&&g++<600){r.push(m);m=addMonth(m,1)}return r}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const mLabel=m=>m?MN[+m.slice(5)-1]+' '+m.slice(0,4):'—';
const mLabelS=m=>MN[+m.slice(5)-1]+" '"+m.slice(2,4);
const dLabel=d=>{if(!d)return'—';const[y,m,dd]=d.split('-');return `${dd} ${MN[+m-1]} ${y}`};
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const cv=n=>getComputedStyle(document.body).getPropertyValue(n).trim();
function alpha(c,a){if(!c)return`rgba(120,120,120,${a})`;if(c.startsWith('#')){let h=c.slice(1);if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}return c}
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const mColor=i=>`hsl(${(i*137.5+215)%360} 68% 56%)`;
function memberColor(id){const i=DB.members.findIndex(m=>m.id===id);return mColor(i<0?0:i)}
function avatar(m,cls=''){return `<div class="av ${cls}" style="--c:${memberColor(m.id)}">${esc(initials(m.name))}</div>`}

/* ================= STATE ================= */
const DEF_SETTINGS={name:'Unique Twelve',tagline:'Savings Samity',startMonth:'2022-07',dueDay:10,defaultDown:5000,rates:[{from:'2022-07',amount:2000},{from:'2024-07',amount:3000}],adminPassword:'1535'};
let DB={members:[],payments:[],banks:[],expenses:[],assets:[],transfers:[],settings:{...DEF_SETTINGS}};
let isAdmin=false, adminPw='', page='overview', charts={};
const IS_GAS=!!(window.google&&google.script&&google.script.run);
const LS='uniqueTwelve_v1', LST='uniqueTwelve_theme';
const S=()=>DB.settings;
let qp={month:curMonth(),type:'Monthly',date:todayStr(),bank:''};
let led={type:'all',member:'all',bank:'all',q:'',limit:60};
let pv={id:null,tab:'calendar',year:+todayStr().slice(0,4)};

/* ================= DATA LAYER ================= */
function gas(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))}
const API={
  async load(){if(IS_GAS)return gas('apiLoad');try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}},
  async login(pw){if(IS_GAS)return gas('apiLogin',pw);return pw===(S().adminPassword||'1535')},
  async save(t,r){if(IS_GAS)return gas('apiSave',adminPw,t,r)},
  async saveMany(t,rs){if(IS_GAS)return gas('apiSaveMany',adminPw,t,rs)},
  async del(t,ids){if(IS_GAS)return gas('apiDelete',adminPw,t,ids)},
  async settings(s){if(IS_GAS){const c={...s};delete c.adminPassword;return gas('apiSettings',adminPw,c)}},
  async restore(d){if(IS_GAS){const c=JSON.parse(JSON.stringify(d));if(c.settings)delete c.settings.adminPassword;return gas('apiRestore',adminPw,c)}},
  async changePw(n){if(IS_GAS)return gas('apiChangePassword',adminPw,n);S().adminPassword=n}
};
function persist(){if(!IS_GAS)try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}}
function normalize(d){d=d||{};const o={};['members','payments','banks','expenses','assets','transfers'].forEach(k=>o[k]=Array.isArray(d[k])?d[k]:[]);
  o.settings={...DEF_SETTINGS,...(d.settings||{})};if(!Array.isArray(o.settings.rates)||!o.settings.rates.length)o.settings.rates=DEF_SETTINGS.rates;
  if(!o.banks.find(b=>b.id==='cash'))o.banks.unshift({id:'cash',name:'Cash in Hand',type:'Cash',accountNo:'—',branch:'Treasurer',openingBalance:0,rate:0,openDate:'',maturity:'',note:''});
  return o}
function errMsg(e){return(e&&(e.message||e.toString()))||'Unknown error'}
function busy(on){$('#busy').classList.toggle('on',on)}
function guard(){if(!isAdmin){openLogin();return false}return true}
async function run(fn,okMsg){busy(true);try{await fn();persist();refresh();if(okMsg)toast(okMsg);return true}catch(e){toast('Failed: '+errMsg(e),'bad');return false}finally{busy(false)}}
async function upsert(t,rec,okMsg='Saved'){if(!guard())return false;rec.id=rec.id||uid();return run(async()=>{await API.save(t,rec);const a=DB[t],i=a.findIndex(x=>x.id===rec.id);i>=0?a[i]=rec:a.push(rec)},okMsg)}
async function upsertMany(t,recs,okMsg){if(!guard())return false;recs.forEach(r=>r.id=r.id||uid());return run(async()=>{await API.saveMany(t,recs);recs.forEach(r=>{const a=DB[t],i=a.findIndex(x=>x.id===r.id);i>=0?a[i]=r:a.push(r)})},okMsg)}
async function remove(t,ids,okMsg='Deleted'){if(!guard())return false;ids=[].concat(ids);return run(async()=>{await API.del(t,ids);DB[t]=DB[t].filter(x=>!ids.includes(x.id))},okMsg)}

/* ================= CALCULATIONS ================= */
function rateFor(m){let r=0;[...S().rates].sort((a,b)=>a.from<b.from?-1:1).forEach(x=>{if(x.from<=m)r=+x.amount});return r}
function memberStart(mem){const j=(mem.joinDate||S().startMonth).slice(0,7);return j<S().startMonth?S().startMonth:j}
const activeMembers=()=>DB.members.filter(m=>m.status!=='Inactive');
const bankName=id=>(DB.banks.find(b=>b.id===id)||{}).name||'—';
function monthPays(mid,m,type='Monthly'){return DB.payments.filter(p=>p.memberId===mid&&p.month===m&&(type==='Monthly'?p.type!=='Down Payment':p.type==='Down Payment'))}
function status(mem,m){
  const cm=curMonth();if(m>cm)return{s:'future',paid:0,due:rateFor(m)};if(m<memberStart(mem))return{s:'na',paid:0,due:0};
  const ps=monthPays(mem.id,m),paid=sum(ps,p=>p.amount),due=rateFor(m),last=ps.map(p=>p.date).sort().pop();
  if(due>0&&paid>=due){const late=last>m+'-'+pad(S().dueDay);return{s:late?'late':'paid',paid,due,date:last,ps}}
  if(paid>0)return{s:'partial',paid,due,date:last,ps};
  if(m===cm&&+todayStr().slice(8)<=+S().dueDay)return{s:'pending',paid:0,due,ps};
  return{s:'unpaid',paid:0,due,ps}}
const ST_LABEL={paid:'Paid',late:'Paid Late',unpaid:'Unpaid',partial:'Partial',pending:'Due Soon',future:'Upcoming',na:'Not Joined'};
const badge=s=>`<span class="badge b-${s}">${ST_LABEL[s]||s}</span>`;
function memberStats(mem){
  const cm=curMonth();let paid=0,late=0,unpaid=0,partial=0,outstanding=0;
  monthsBetween(memberStart(mem),cm).forEach(m=>{const s=status(mem,m);if(s.s==='paid')paid++;else if(s.s==='late')late++;else if(s.s==='unpaid'){unpaid++;outstanding+=s.due}else if(s.s==='partial'){partial++;outstanding+=s.due-s.paid}});
  const ps=DB.payments.filter(p=>p.memberId===mem.id);
  const monthly=sum(ps.filter(p=>p.type!=='Down Payment'),p=>p.amount),down=sum(ps.filter(p=>p.type==='Down Payment'),p=>p.amount);
  const n=paid+late+unpaid+partial;
  return{paid,late,unpaid,partial,outstanding,monthly,down,total:monthly+down,count:ps.length,downCount:ps.filter(p=>p.type==='Down Payment').length,onTime:n?Math.round(paid/n*100):100,last:ps.map(p=>p.date).sort().pop()}}
function bankBalance(id){const b=DB.banks.find(x=>x.id===id)||{};
  return(+b.openingBalance||0)+sum(DB.payments.filter(p=>p.bankId===id),p=>p.amount)+sum(DB.assets.filter(a=>a.bankId===id&&a.status==='Sold'),a=>a.saleAmount)+sum(DB.transfers.filter(t=>t.toBankId===id),t=>t.amount)
   -sum(DB.expenses.filter(e=>e.bankId===id),e=>e.amount)-sum(DB.assets.filter(a=>a.bankId===id),a=>a.cost)-sum(DB.transfers.filter(t=>t.fromBankId===id),t=>t.amount)}
function totals(){
  const monthly=sum(DB.payments.filter(p=>p.type!=='Down Payment'),p=>p.amount),down=sum(DB.payments.filter(p=>p.type==='Down Payment'),p=>p.amount);
  const opening=sum(DB.banks,b=>b.openingBalance),expenses=sum(DB.expenses,e=>e.amount),assetCost=sum(DB.assets,a=>a.cost);
  const sales=sum(DB.assets.filter(a=>a.status==='Sold'),a=>a.saleAmount),assetValue=sum(DB.assets.filter(a=>a.status!=='Sold'),a=>a.currentValue||a.cost);
  const cash=opening+monthly+down+sales-expenses-assetCost;
  const fdr=sum(DB.banks.filter(b=>b.type==='FDR'||b.type==='DPS'),b=>bankBalance(b.id));
  const outstanding=sum(DB.members.filter(m=>m.status!=='Inactive'),m=>memberStats(m).outstanding);
  return{monthly,down,collected:monthly+down,opening,expenses,assetCost,sales,assetValue,cash,fdr,liquid:cash-fdr,netWorth:cash+assetValue,outstanding}}
function monthSummary(m){const ms=activeMembers();let done=0,collected=0,expected=0;ms.forEach(mem=>{const s=status(mem,m);if(s.s==='na')return;expected+=s.due;collected+=s.paid;if(s.s==='paid'||s.s==='late')done++});return{done,total:ms.filter(x=>memberStart(x)<=m).length,collected,expected}}
function ledgerEntries(){
  const E=[],mem=id=>DB.members.find(m=>m.id===id);
  DB.payments.forEach(p=>E.push({src:'payments',id:p.id,date:p.date,kind:p.type==='Down Payment'?'Down Payment':'Contribution',desc:(p.type==='Down Payment'?'Down payment':'Monthly contribution')+' · '+mLabel(p.month),who:mem(p.memberId)?.name||'—',mid:p.memberId,bankId:p.bankId,inn:+p.amount,out:0}));
  DB.expenses.forEach(x=>E.push({src:'expenses',id:x.id,date:x.date,kind:'Expense',desc:x.category+(x.note?' · '+x.note:''),who:'—',bankId:x.bankId,inn:0,out:+x.amount}));
  DB.assets.forEach(a=>{E.push({src:'assets',id:a.id,date:a.date,kind:'Asset Purchase',desc:a.name+' ('+a.type+')',who:'—',bankId:a.bankId,inn:0,out:+a.cost});if(a.status==='Sold'&&+a.saleAmount)E.push({src:'assets',id:a.id,date:a.saleDate||a.date,kind:'Asset Sale',desc:a.name+' sold',who:'—',bankId:a.bankId,inn:+a.saleAmount,out:0})});
  DB.transfers.forEach(t=>E.push({src:'transfers',id:t.id,date:t.date,kind:'Transfer',desc:bankName(t.fromBankId)+' → '+bankName(t.toBankId)+(t.note?' · '+t.note:''),who:'—',bankId:t.fromBankId,bankId2:t.toBankId,inn:0,out:0,amt:+t.amount}));
  E.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);let bal=sum(DB.banks,b=>b.openingBalance);E.forEach(e=>{bal+=e.inn-e.out;e.bal=bal});return E}
function cashSeries(){const cm=curMonth();const months=monthsBetween(S().startMonth,cm);const E=ledgerEntries();let i=0,bal=sum(DB.banks,b=>b.openingBalance);const cash=[],nw=[];
  months.forEach(m=>{while(i<E.length&&E[i].date.slice(0,7)<=m){bal+=E[i].inn-E[i].out;i++}cash.push(bal);const av=sum(DB.assets.filter(a=>a.date.slice(0,7)<=m&&!(a.status==='Sold'&&(a.saleDate||'').slice(0,7)<=m)),a=>a.currentValue||a.cost);nw.push(bal+av)});return{months,cash,nw}}

function buildNav(){$('#nav').innerHTML=NAV.map(n=>n.length===1?`<div class="grp">${n[0]}</div>`:`<a data-p="${n[0]}" class="${page===n[0]?'active':''}" onclick="go('${n[0]}')">${icon(n[2])}<span>${n[1]}</span>${n[3]?`<span class="lk member-only">${icon('lock')}</span>`:''}</a>`).join('')}

function render(){
  document.body.classList.toggle('admin',isAdmin);
  $('#brandName').textContent=S().name;$('#logoTxt').textContent=initials(S().name).slice(0,2)+(S().name.match(/\d+/)||[''])[0];

  buildNav();const[t,s]=TITLES[page];$('#pageTitle').textContent=t;$('#pageSub').textContent=s;
  $('#srcInfo').innerHTML=IS_GAS?`<span><span class="dot"></span>Google Sheets · Live</span>`:`<span><span class="dot" style="background:var(--warn)"></span>Demo mode · Browser storage</span>`;

function animateCounts(){$$('[data-count]').forEach(el=>{const to=+el.dataset.count,fmt=el.dataset.fmt||'tk',t0=performance.now(),d=900;const f=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3),v=to*e;el.textContent=fmt==='n'?Math.round(v):fmt==='pct'?Math.round(v)+'%':TK(v);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}

const modals=[];
function openModal(title,body,o={}){const el=document.createElement('div');el.className='overlay';
  el.innerHTML=`<div class="modal ${o.wide?'wide':''}"><div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-close>${icon('x')}</button></div><div class="modal-body"></div></div>`;
  document.body.appendChild(el);const m={el,body,o};modals.push(m);paintModal(m);
  el.addEventListener('mousedown',e=>{if(e.target===el)closeModal()});el.querySelector('[data-close]').onclick=()=>closeModal();
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));return m}
function paintModal(m){const b=m.el.querySelector('.modal-body');b.innerHTML=typeof m.body==='function'?m.body():m.body;m.o.after&&m.o.after(b)}
function closeModal(){const m=modals.pop();if(!m)return;if(m.o.onClose)m.o.onClose();m.el.classList.remove('show');setTimeout(()=>m.el.remove(),280)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modals.length)closeModal()});
function confirmBox(msg,yes='Delete',danger=true){return new Promise(res=>{let done=false;
  openModal('Please confirm',`<p style="line-height:1.6">${msg}</p><div class="modal-actions"><button class="btn ghost" id="cfN">Cancel</button><button class="btn ${danger?'danger':'primary'}" id="cfY">${yes}</button></div>`,{after:b=>{b.querySelector('#cfN').onclick=()=>closeModal();b.querySelector('#cfY').onclick=()=>{done=true;closeModal();res(true)}},onClose:()=>{if(!done)res(false)}})})}
function formHTML(fields,rec={}){return '<div class="form-grid">'+fields.map(f=>{const v=rec[f.k]??f.def??'';let inp;
  if(f.type==='select')inp=`<select name="${f.k}" ${f.req?'required':''}>${(f.blank?[['','— Select —']]:[]).concat(f.options).map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea name="${f.k}" rows="2">${esc(v)}</textarea>`;
  else inp=`<input name="${f.k}" type="${f.type||'text'}" value="${esc(v)}" ${f.req?'required':''} ${f.type==='number'?'step="any" min="0"':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return`<label class="fld ${f.full?'full':''}"><span>${f.label}</span>${inp}</label>`}).join('')+'</div>'}
function formModal(title,fields,rec,onSave){
  openModal(title,`<form id="mf">${formHTML(fields,rec)}<div class="modal-actions"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn primary">${icon('check')} Save</button></div></form>`,{after:b=>{
    b.querySelector('[data-cancel]').onclick=()=>closeModal();
    b.querySelector('#mf').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),out={...rec};fields.forEach(f=>{let v=fd.get(f.k);if(f.type==='number')v=v===''||v==null?0:+v;out[f.k]=v??''});
      const r=await onSave(out);if(r!==false)closeModal()}}})}

function openProfile(id,tab='overview'){pv.id=id;pv.tab=tab;pv.year=+todayStr().slice(0,4);const m=DB.members.find(x=>x.id===id);if(!m)return;openModal('Member Profile',profileBody,{wide:true,after:profileAfter})}
function profileBody(){const m=DB.members.find(x=>x.id===pv.id);if(!m)return'<div class="empty">Member removed</div>';const st=memberStats(m),T=totals(),share=T.collected?st.total/T.collected*100:0;
  const tabs=[['overview','Overview'],['calendar','Payment Calendar'],['history','Payment History']];
  let inner='';
  if(pv.tab==='calendar'){const y0=+memberStart(m).slice(0,4),y1=Math.max(+curMonth().slice(0,4),y0);pv.year=Math.min(Math.max(pv.year,y0),y1);
    const months=Array.from({length:12},(_,i)=>pv.year+'-'+pad(i+1));const ys=sum(DB.payments.filter(p=>p.memberId===m.id&&p.month.startsWith(pv.year)),p=>p.amount);
    inner=`<div class="toolbar" style="justify-content:space-between;margin-bottom:14px"><div style="display:flex;align-items:center;gap:8px"><button class="icon-btn sm" ${pv.year<=y0?'disabled':''} onclick="pv.year--;refresh()">${icon('chevL')}</button><b style="font-size:17px;min-width:56px;text-align:center">${pv.year}</b><button class="icon-btn sm" ${pv.year>=y1?'disabled':''} onclick="pv.year++;refresh()">${icon('chevR')}</button><span class="sub" style="margin:0 0 0 8px">Paid in ${pv.year}: <b style="color:var(--text)">${TK(ys)}</b></span></div><div class="legend"><span><i style="background:var(--good)"></i>On time</span><span><i style="background:var(--warn)"></i>Late</span><span><i style="background:var(--bad)"></i>Unpaid</span><span><i style="background:var(--info)"></i>Partial</span></div></div>
    <div class="cal">${months.map(mo=>{const s=status(m,mo),dn=monthPays(m.id,mo,'Down');return`<div class="cc ${s.s}" onclick="calClick('${m.id}','${mo}')"><span class="st">${icon(s.s==='paid'||s.s==='late'?'check':s.s==='unpaid'?'x':s.s==='partial'?'clock':'cal')}</span><b>${MNF[+mo.slice(5)-1]}</b><div class="a">${s.paid?TK(s.paid):s.s==='future'||s.s==='na'?'—':TK(0)}</div><div class="d">${s.date?'Paid '+dLabel(s.date):ST_LABEL[s.s]}${s.s==='late'?` · ${Math.round((new Date(s.date)-new Date(mo+'-'+pad(S().dueDay)))/864e5)}d late`:''}</div>${dn.length?`<div class="d" style="color:var(--accent2);font-weight:700">+ Down ${TK(sum(dn,p=>p.amount))}</div>`:''}</div>`}).join('')}</div>
    <div class="sub" style="margin-top:12px">Due date: ${pad(S().dueDay)}th of each month. ${isAdmin?'Click any month to record or edit its payment.':'Click a month to see its details.'}</div>`}
  else if(pv.tab==='history'){const ps=DB.payments.filter(p=>p.memberId===m.id).sort((a,b)=>a.date<b.date?1:-1);
    inner=`<div class="toolbar" style="margin-bottom:10px;justify-content:space-between"><span class="sub">${ps.length} payments · ${st.downCount} down payments</span><button class="btn primary sm admin-only" onclick="paymentForm({memberId:'${m.id}'})">${icon('plus')} Add Payment</button></div><div class="tw"><table class="tbl"><thead><tr><th>Paid on</th><th>For month</th><th>Type</th><th>Bank</th><th>Status</th><th class="r">Amount</th><th class="admin-only"></th></tr></thead><tbody>${ps.map(p=>{const late=p.type!=='Down Payment'&&p.date>p.month+'-'+pad(S().dueDay);return`<tr><td>${dLabel(p.date)}</td><td>${mLabel(p.month)}</td><td>${p.type==='Down Payment'?'<span class="badge b-acc">Down Payment</span>':'Monthly'}</td><td>${esc(bankName(p.bankId))}</td><td>${p.type==='Down Payment'?'—':badge(late?'late':'paid')}</td><td class="r"><b>${TK(p.amount)}</b></td><td class="admin-only" style="display:table-cell"><button class="icon-btn sm admin-only" onclick="editRec('payments','${p.id}')">${icon('edit')}</button> <button class="icon-btn sm admin-only" onclick="delRec('payments','${p.id}','payment')">${icon('trash')}</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No payments yet</td></tr>'}</tbody></table></div>`}
  else{inner=`<div class="g11"><div><h2 style="margin-bottom:10px">Contribution by year</h2><div class="chart-box sm"><canvas id="cMemYear"></canvas></div></div><div><h2 style="margin-bottom:10px">Details</h2><div class="statement">
    <div class="ln"><span class="muted">Phone</span><b>${esc(m.phone||'—')}</b></div><div class="ln"><span class="muted">Email</span><b>${esc(m.email||'—')}</b></div><div class="ln"><span class="muted">Joined</span><b>${dLabel(m.joinDate)}</b></div><div class="ln"><span class="muted">Usual bank</span><b>${esc(bankName(m.bankId))}</b></div><div class="ln"><span class="muted">Nominee</span><b>${esc(m.nominee||'—')}</b></div><div class="ln"><span class="muted">Last payment</span><b>${dLabel(st.last)}</b></div><div class="ln"><span class="muted">Share of fund</span><b>${share.toFixed(2)}%</b></div><div class="ln"><span class="muted">Equity value (share × net worth)</span><b>${TK(share/100*T.netWorth)}</b></div></div></div></div>`}
  return`<div class="who" style="gap:16px;margin-bottom:18px;flex-wrap:wrap">${avatar(m,'lg')}<div style="flex:1;min-width:180px"><h1>${esc(m.name)}</h1><div class="sub">${esc(m.phone||'')} ${m.email?'· '+esc(m.email):''} · Member since ${mLabel(memberStart(m))}</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${m.status==='Inactive'?'<span class="badge b-na">Inactive</span>':'<span class="badge b-paid">Active</span>'}${badge(status(m,curMonth()).s)}</div></div><div style="display:flex;gap:8px"><button class="btn primary sm admin-only" onclick="paymentForm({memberId:'${m.id}'})">${icon('plus')} Payment</button><button class="btn ghost sm admin-only" onclick="memberForm({...DB.members.find(x=>x.id==='${m.id}')})">${icon('edit')} Edit</button><button class="icon-btn sm admin-only" onclick="delMember('${m.id}')">${icon('trash')}</button></div></div>
  <div class="stats" style="margin-bottom:16px"><div class="stat"><small>Total paid</small><div>${TK(st.total)}</div></div><div class="stat"><small>Monthly</small><div>${TK(st.monthly)}</div></div><div class="stat"><small>Down payments</small><div>${TK(st.down)}</div></div><div class="stat"><small>Payments made</small><div>${st.count}</div></div><div class="stat"><small>Late months</small><div class="${st.late?'warn':''}">${st.late}</div></div><div class="stat"><small>On-time rate</small><div class="${st.onTime>=80?'good':'warn'}">${st.onTime}%</div></div><div class="stat"><small>Outstanding</small><div class="${st.outstanding?'bad':'good'}">${TK(st.outstanding)}</div></div></div>
  <div class="tabs" style="margin-bottom:16px">${tabs.map(([k,l])=>`<button class="${pv.tab===k?'on':''}" onclick="pv.tab='${k}';refresh()">${l}</button>`).join('')}</div>${inner}`}
function profileAfter(){if(pv.tab!=='overview')return;const m=DB.members.find(x=>x.id===pv.id);if(!m)return;const y0=+memberStart(m).slice(0,4),y1=+curMonth().slice(0,4);const ys=[];for(let y=y0;y<=y1;y++)ys.push(y);
  if(charts.cMemYear)charts.cMemYear.destroy();
  mk('cMemYear',{type:'bar',data:{labels:ys,datasets:[{label:'Monthly',data:ys.map(y=>sum(DB.payments.filter(p=>p.memberId===m.id&&p.type!=='Down Payment'&&p.month.startsWith(y)),p=>p.amount)),backgroundColor:alpha(memberColor(m.id),.85),borderRadius:6,stack:'a'},{label:'Down',data:ys.map(y=>sum(DB.payments.filter(p=>p.memberId===m.id&&p.type==='Down Payment'&&p.month.startsWith(y)),p=>p.amount)),backgroundColor:alpha(cv('--accent2'),.6),borderRadius:6,stack:'a'}]},options:baseOpts({scales:{y:{...yTK,stacked:true},x:{stacked:true,grid:{display:false}}}})})}
function calClick(mid,mo){const m=DB.members.find(x=>x.id===mid),s=status(m,mo),ps=DB.payments.filter(p=>p.memberId===mid&&p.month===mo);
  if(s.s==='na'){toast('Member had not joined in '+mLabel(mo),'warn');return}
  openModal(`${esc(m.name)} · ${mLabel(mo)}`,()=>{const ps2=DB.payments.filter(p=>p.memberId===mid&&p.month===mo),s2=status(m,mo);return`<div class="stats" style="margin-bottom:14px"><div class="stat"><small>Status</small><div>${badge(s2.s)}</div></div><div class="stat"><small>Due</small><div>${TK(s2.due)}</div></div><div class="stat"><small>Paid</small><div>${TK(s2.paid)}</div></div></div>
  ${ps2.length?`<div class="list">${ps2.map(p=>`<div class="li"><div class="tico in">${icon('arrowIn')}</div><div class="grow"><b>${p.type} · ${TK(p.amount)}</b><small>${dLabel(p.date)} · ${esc(bankName(p.bankId))}${p.note?' · '+esc(p.note):''}</small></div><button class="icon-btn sm admin-only" onclick="editRec('payments','${p.id}')">${icon('edit')}</button><button class="icon-btn sm admin-only" onclick="delRec('payments','${p.id}','payment')">${icon('trash')}</button></div>`).join('')}</div>`:'<div class="empty">No payment recorded for this month</div>'}
  <div class="modal-actions admin-only" style="display:flex"><button class="btn ghost" onclick="paymentForm({memberId:'${mid}',month:'${mo}',type:'Down Payment'})">${icon('plus')} Down Payment</button>${s2.paid<s2.due?`<button class="btn primary" onclick="paymentForm({memberId:'${mid}',month:'${mo}',amount:${s2.due-s2.paid}})">${icon('check')} Record ${TK(s2.due-s2.paid)}</button>`:''}</div>`})}

/* ---- quick pay ---- */
PAGES.quickpay=()=>{if(!qp.bank)qp.bank='';const m=qp.month,isDown=qp.type==='Down Payment';const rows=activeMembers().filter(x=>memberStart(x)<=m);
  let paidN=0,col=0,exp=0;rows.forEach(x=>{if(isDown){const d=monthPays(x.id,m,'Down');if(d.length){paidN++;col+=sum(d,p=>p.amount)}exp+=+S().defaultDown}else{const s=status(x,m);if(s.s==='paid'||s.s==='late')paidN++;col+=s.paid;exp+=s.due}});
  const pct=rows.length?Math.round(paidN/rows.length*100):0;
  return`${isAdmin?'':`<div class="note">${icon('lock')} Quick Pay is for the admin. You can see who has paid, but recording payments needs the admin password. <button class="btn primary sm" style="margin-left:8px" onclick="openLogin()">Admin Login</button></div>`}
  <div class="glass card"><div class="toolbar" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px"><button class="icon-btn" onclick="qp.month=addMonth(qp.month,-1);render()">${icon('chevL')}</button><input type="month" value="${m}" style="width:170px;font-weight:700" onchange="if(this.value){qp.month=this.value;render()}"><button class="icon-btn" onclick="qp.month=addMonth(qp.month,1);render()">${icon('chevR')}</button></div>
    <div class="tabs"><button class="${!isDown?'on':''}" onclick="qp.type='Monthly';render()">Monthly ${TK(rateFor(m))}</button><button class="${isDown?'on':''}" onclick="qp.type='Down Payment';render()">Down Payment</button></div></div>
    <div class="stats" style="margin-top:14px"><div class="stat"><small>Paid</small><div class="good">${paidN} / ${rows.length}</div></div><div class="stat"><small>Collected</small><div>${TK(col)}</div></div><div class="stat"><small>Expected</small><div>${TK(exp)}</div></div><div class="stat"><small>Remaining</small><div class="${exp-col>0?'bad':'good'}">${TK(Math.max(0,exp-col))}</div></div></div>
    <div class="prog" style="margin-top:14px"><i style="width:${pct}%"></i></div></div>
  <div class="glass card"><div class="toolbar" style="margin-bottom:12px;justify-content:space-between"><div><h2>${isDown?'Down payments':'Monthly contributions'} · ${mLabel(m)}</h2><div class="sub">Set amount, date and bank, then tap Pay. Tick several rows to pay them all at once.</div></div>
    <div class="toolbar"><label class="fld" style="flex-direction:row;align-items:center"><span>Date for all</span><input type="date" value="${qp.date}" style="width:150px" onchange="qp.date=this.value;$$('.qd').forEach(i=>i.value=this.value)"></label><button class="btn primary" onclick="paySelected()" ${isAdmin?'':'disabled'}>${icon('zap')} Pay Selected</button></div></div>
  <div class="tw"><table class="tbl"><thead><tr><th><input type="checkbox" onchange="$$('.qc:not(:disabled)').forEach(c=>c.checked=this.checked)" ${isAdmin?'':'disabled'}></th><th>Member</th><th>Status</th><th>Amount (৳)</th><th>Date</th><th>Bank</th><th class="r">Action</th></tr></thead><tbody>
  ${rows.map(x=>{let st,paid=0,remain;if(isDown){const d=monthPays(x.id,m,'Down');paid=sum(d,p=>p.amount);st=d.length?'paid':'unpaid';remain=+S().defaultDown}else{const s=status(x,m);st=s.s;paid=s.paid;remain=Math.max(0,s.due-s.paid)}
    const done=st==='paid'||st==='late';const lastP=(isDown?monthPays(x.id,m,'Down'):monthPays(x.id,m)).map(p=>p.date).sort().pop();
    return`<tr id="qr-${x.id}"><td><input type="checkbox" class="qc" value="${x.id}" ${done||!isAdmin?'disabled':''}></td><td><div class="who" style="cursor:pointer" onclick="openProfile('${x.id}','calendar')">${avatar(x)}<div><b>${esc(x.name)}</b><div class="sub">${paid?'Paid '+TK(paid):'Nothing paid'}</div></div></div></td><td>${badge(st)}</td>
    ${done?`<td colspan="3" class="muted">${TK(paid)} on ${dLabel(lastP)}</td><td class="r"><button class="btn success sm" disabled>${icon('check')} Paid</button> <button class="icon-btn sm admin-only" title="Undo" onclick="undoPay('${x.id}')">${icon('x')}</button></td>`:
    `<td><input type="number" class="qa" id="qa-${x.id}" value="${remain}" min="0" style="width:110px" ${isAdmin?'':'disabled'}></td><td><input type="date" class="qd" id="qd-${x.id}" value="${qp.date}" style="width:150px" ${isAdmin?'':'disabled'}></td><td><select id="qb-${x.id}" style="width:170px" ${isAdmin?'':'disabled'}>${bankOpts().map(([v,l])=>`<option value="${v}" ${v===(qp.bank||x.bankId||'cash')?'selected':''}>${esc(l)}</option>`).join('')}</select></td><td class="r"><button class="btn primary sm" onclick="payOne('${x.id}')" ${isAdmin?'':'disabled'}>${icon('check')} Pay</button></td>`}</tr>`}).join('')||'<tr><td colspan="7" class="empty">No active members for this month</td></tr>'}
  </tbody></table></div></div>`};
function qpRec(id){const amt=+$('#qa-'+id).value;if(!(amt>0))return null;return{memberId:id,month:qp.month,type:qp.type,amount:amt,date:$('#qd-'+id).value||todayStr(),bankId:$('#qb-'+id).value,note:'Quick Pay'}}
async function payOne(id){if(!guard())return;const r=qpRec(id);if(!r){toast('Enter an amount','warn');return}const n=DB.members.find(x=>x.id===id).name;await upsert('payments',r,`${n} · ${TK(r.amount)} paid`)}
async function paySelected(){if(!guard())return;const ids=$$('.qc:checked').map(c=>c.value);if(!ids.length){toast('Tick at least one member','warn');return}const recs=ids.map(qpRec).filter(Boolean);
  if(await confirmBox(`Record ${recs.length} payment(s) totalling <b>${TK(sum(recs,r=>r.amount))}</b> for ${mLabel(qp.month)}?`,'Pay all',false))upsertMany('payments',recs,`${recs.length} payments recorded`)}
async function undoPay(id){const ps=qp.type==='Down Payment'?monthPays(id,qp.month,'Down'):monthPays(id,qp.month);if(await confirmBox(`Remove ${ps.length} payment(s) for this member in ${mLabel(qp.month)}?`,'Remove'))remove('payments',ps.map(p=>p.id),'Payment removed')}

/* ---- ledger ---- */
function filteredLedger(){let E=ledgerEntries();if(led.type!=='all')E=E.filter(e=>e.kind===led.type);if(led.member!=='all')E=E.filter(e=>e.mid===led.member);if(led.bank!=='all')E=E.filter(e=>e.bankId===led.bank||e.bankId2===led.bank);
  if(led.q){const q=led.q.toLowerCase();E=E.filter(e=>(e.desc+' '+e.who+' '+e.kind).toLowerCase().includes(q))}return E.reverse()}
PAGES.ledger=()=>{const E=filteredLedger(),tin=sum(E,e=>e.inn),tout=sum(E,e=>e.out);const sel=(k,opts)=>`<select style="width:auto" onchange="led.${k}=this.value;led.limit=60;render()">${opts.map(([v,l])=>`<option value="${v}" ${led[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  return`<div class="kpis">${kpi('Money In',tin,'arrowIn',cv('--good'),`${E.filter(e=>e.inn).length} entries`)}${kpi('Money Out',tout,'arrowOut',cv('--bad'),`${E.filter(e=>e.out).length} entries`)}${kpi('Net',tin-tout,'wallet',cv('--accent'),'For current filter')}${kpi('Transactions',E.length,'book',cv('--info'),'',  'n')}</div>
  <div class="glass card"><div class="toolbar" style="margin-bottom:14px"><div class="search grow">${icon('search')}<input placeholder="Search ledger…" value="${esc(led.q)}" onchange="led.q=this.value;render()"></div>${sel('type',[['all','All types'],['Contribution','Contributions'],['Down Payment','Down Payments'],['Expense','Expenses'],['Asset Purchase','Asset Purchases'],['Asset Sale','Asset Sales'],['Transfer','Transfers']])}${sel('member',[['all','All members'],...memberOpts()])}${sel('bank',[['all','All accounts'],...DB.banks.map(b=>[b.id,b.name])])}<button class="btn ghost" onclick="exportLedger()">${icon('download')} CSV</button><button class="btn primary admin-only" onclick="paymentForm()">${icon('plus')} Entry</button></div>
  <div class="tw"><table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Member</th><th>Account</th><th class="r">In</th><th class="r">Out</th><th class="r">Balance</th><th></th></tr></thead><tbody>
  ${E.slice(0,led.limit).map(e=>`<tr><td>${dLabel(e.date)}</td><td><span class="badge ${e.kind==='Expense'||e.kind==='Asset Purchase'?'b-unpaid':e.kind==='Transfer'?'b-partial':e.kind==='Down Payment'?'b-acc':'b-paid'}">${e.kind}</span></td><td style="white-space:normal;min-width:180px">${esc(e.desc)}</td><td>${esc(e.who)}</td><td>${esc(bankName(e.bankId))}${e.bankId2?' → '+esc(bankName(e.bankId2)):''}</td><td class="r good">${e.inn?TK(e.inn):e.amt?`<span class="muted">${TK(e.amt)}</span>`:''}</td><td class="r bad">${e.out?TK(e.out):''}</td><td class="r"><b>${TK(e.bal)}</b></td><td style="display:table-cell"><span class="admin-only" style="gap:6px"><button class="icon-btn sm" onclick="editRec('${e.src}','${e.id}')">${icon('edit')}</button><button class="icon-btn sm" onclick="delRec('${e.src}','${e.id}','entry')">${icon('trash')}</button></span></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No entries</td></tr>'}
  </tbody></table></div>${E.length>led.limit?`<div style="text-align:center;margin-top:14px"><button class="btn ghost" onclick="led.limit+=100;render()">Show more (${E.length-led.limit} left)</button></div>`:''}</div>`};

  <div class="toolbar"><h2 class="grow">Accounts</h2><button class="btn ghost admin-only" onclick="transferForm()">${icon('swap')} Transfer</button><button class="btn primary admin-only" onclick="bankForm()">${icon('plus')} Add Account</button></div>
  <div class="mgrid">${DB.banks.map((b,i)=>{const bal=bankBalance(b.id),days=b.maturity?Math.ceil((new Date(b.maturity)-new Date(todayStr()))/864e5):null;return`<div class="bcard glass" style="border-top:3px solid ${PAL()[i%8]}"><div class="acts admin-only"><button class="icon-btn sm" onclick="editRec('banks','${b.id}')">${icon('edit')}</button>${b.id==='cash'?'':`<button class="icon-btn sm" onclick="delRec('banks','${b.id}','account')">${icon('trash')}</button>`}</div>

    <div class="meta">${+b.rate?`<span>${icon('trend')} ${b.rate}% p.a.</span>`:''}${b.openDate?`<span>Opened ${dLabel(b.openDate)}</span>`:''}${b.maturity?`<span class="${days<=30?'warn':''}">Matures ${dLabel(b.maturity)}${days!=null?` (${days>0?days+' days':'matured'})`:''}</span>`:''}</div></div>`}).join('')}</div>

  try{const d=await API.load();if(d&&Array.isArray(d.members)&&(d.members.length||IS_GAS))DB=normalize(d);else{DB=makeDemo();persist()}}catch(e){DB=makeDemo();setTimeout(()=>toast('Could not load data: '+errMsg(e),'bad'),500)}
  page=(location.hash||'#overview').slice(1);if(!TITLES[page])page='overview';render();
  const L=$('#loader');L.style.opacity='0';setTimeout(()=>L.remove(),400);
  if(IS_GAS&&!DB.members.length)setTimeout(()=>toast('No data yet — log in as admin, then Settings → Load demo data or add members','warn'),800)})();
</script>
</body>
</html>
