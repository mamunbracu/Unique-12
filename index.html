<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unique Twelve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="dark"]{--bg:#070b18;--b1:#3b5bfd;--b2:#a64bff;--b3:#00c2a8;--blob:.38;--card:rgba(255,255,255,.055);--modal:rgba(16,21,42,.92);--border:rgba(255,255,255,.1);--text:#e9edfb;--muted:#8d97b8;--accent:#6d8bff;--accent2:#b06bff;--on-accent:#fff;--good:#2fd47f;--warn:#ffb547;--bad:#ff5d73;--info:#38bdf8;--input:rgba(255,255,255,.06);--shadow:0 10px 40px rgba(0,0,0,.35);--blur:18px}
[data-theme="glass"]{--bg:#e6eaff;--b1:#8ea8ff;--b2:#f7a1d8;--b3:#7ee0d2;--blob:.75;--card:rgba(255,255,255,.48);--modal:rgba(255,255,255,.9);--border:rgba(255,255,255,.8);--text:#1d2340;--muted:#5d6588;--accent:#5b5bf0;--accent2:#d14fb3;--on-accent:#fff;--good:#11a35d;--warn:#d48806;--bad:#e0344f;--info:#0284c7;--input:rgba(255,255,255,.6);--shadow:0 10px 40px rgba(60,70,140,.16)}
[data-theme="royal"]{--bg:#061451;--b1:#1d4ed8;--b2:#3b2bbf;--b3:#f5c542;--blob:.4;--card:rgba(255,255,255,.07);--modal:rgba(10,28,96,.94);--border:rgba(255,255,255,.13);--text:#f1f4ff;--muted:#a4b1e3;--accent:#f5c542;--accent2:#ffa53b;--on-accent:#1a1400;--good:#3ee08f;--warn:#ffc04d;--bad:#ff6b81;--info:#7cc4ff;--input:rgba(255,255,255,.08);--shadow:0 10px 40px rgba(0,0,30,.45)}
[data-theme="emerald"]{--bg:#03140e;--b1:#0f9d6b;--b2:#045c45;--b3:#a3e635;--blob:.35;--card:rgba(255,255,255,.055);--modal:rgba(6,32,23,.94);--border:rgba(255,255,255,.1);--text:#e7fbf2;--muted:#86b3a2;--accent:#34d399;--accent2:#a3e635;--on-accent:#032016;--good:#4ade80;--warn:#fbbf24;--bad:#fb7185;--info:#67e8f9;--input:rgba(255,255,255,.06);--shadow:0 10px 40px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f3f5fa;--b1:#c7d2fe;--b2:#fbcfe8;--b3:#bae6fd;--blob:.0;--card:#ffffff;--modal:#ffffff;--border:#e3e7f0;--text:#18203a;--muted:#6b7491;--accent:#4f46e5;--accent2:#7c3aed;--on-accent:#fff;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0284c7;--input:#f6f7fb;--shadow:0 4px 18px rgba(20,30,70,.07);--blur:0px}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans','Hind Siliguri',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .5s,color .3s;font-size:14px}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;background:radial-gradient(38% 38% at 15% 20%,var(--b1),transparent 70%),radial-gradient(34% 34% at 85% 12%,var(--b2),transparent 70%),radial-gradient(40% 40% at 70% 92%,var(--b3),transparent 70%);opacity:var(--blob);filter:blur(50px);animation:drift 26s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg)}}
.glass{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);border-radius:18px;box-shadow:var(--shadow)}
.card{padding:18px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px}h2{font-size:16px;font-weight:700}h3{font-size:17px;font-weight:700}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* layout */
.side{width:252px;position:fixed;top:12px;bottom:12px;left:12px;display:flex;flex-direction:column;padding:18px 12px;z-index:60;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.brand b{font-size:16px;display:block;letter-spacing:-.2px}.brand small{color:var(--muted);font-size:11.5px}
.nav{flex:1;overflow:auto}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:12px 12px 6px;font-weight:700}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13.5px;position:relative;transition:all .2s;text-decoration:none;margin-bottom:2px}
.nav a:hover{color:var(--text);background:var(--input)}
.nav a.active{color:var(--text);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,transparent),transparent)}
.nav a.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.nav a .lk{margin-left:auto;opacity:.6}
.side-foot{border-top:1px solid var(--border);padding:12px 8px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent);margin-right:6px}
.main{margin-left:276px;padding:12px 18px 50px 0;min-width:0}
.top{position:sticky;top:12px;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:18px}
.top .ttl{flex:1;min-width:0}
.top .ttl h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.menu-btn{display:none}
.scrim{display:none}
@media(max-width:920px){.side{transform:translateX(-115%)}.side.open{transform:none}.main{margin-left:0;padding:10px 10px 50px}.icon-btn.menu-btn{display:inline-grid}.scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}.hide-sm{display:none!important}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:9px 15px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap;color:var(--text)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 55%,transparent);transform:translateY(-1px)}
.btn.ghost{background:var(--input);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.success{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:11px;display:inline-grid;place-items:center;background:var(--input);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}.icon-btn.sm svg{width:15px;height:15px}
input,select,textarea{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
select option{background:var(--modal);color:var(--text)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--input);border:1px solid var(--border)}
.chip.admin{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-paid{background:color-mix(in srgb,var(--good) 17%,transparent);color:var(--good)}
.b-late{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-unpaid{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.b-partial{background:color-mix(in srgb,var(--info) 17%,transparent);color:var(--info)}
.b-pending,.b-future,.b-na{background:var(--input);color:var(--muted)}
.b-acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

/* grids */
.view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(5){animation-delay:.2s}.view>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.view{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.view>.kpis:has(>.kpi:nth-child(6)){grid-template-columns:repeat(6,1fr)}@media(max-width:1350px){.view>.kpis:has(>.kpi:nth-child(6)){grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.kpis,.view>.kpis:has(>.kpi:nth-child(6)){grid-template-columns:1fr 1fr}.kpi .val{font-size:18px}}
.kpi{padding:16px;position:relative;overflow:hidden;transition:transform .25s}
.kpi:hover{transform:translateY(-3px)}
.kpi .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.4px}
.kpi .ft{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c,var(--accent)) 22%,transparent),transparent 70%)}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.g11{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g111{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1150px){.g21,.g11,.g111{grid-template-columns:1fr}}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.chart-box{position:relative;height:270px}
.chart-box.sm{height:230px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:180px}
.search{position:relative}.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}.search input{padding-left:34px}
.hero{padding:22px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--card)),color-mix(in srgb,var(--accent2) 14%,var(--card)))}
.hero h1{font-size:24px}
.prog{height:9px;border-radius:9px;background:var(--input);overflow:hidden;border:1px solid var(--border)}
.prog>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr{transition:background .15s}.tbl tbody tr:hover{background:var(--input)}
.tbl .r{text-align:right}.tbl tfoot td{font-weight:800;border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;flex:none;background:var(--c)}
.av.lg{width:64px;height:64px;border-radius:20px;font-size:22px}

/* photos & files */
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.lg{width:84px;height:84px;border-radius:24px;font-size:26px}
.avwrap{position:relative;flex:none}
.cam{position:absolute;right:-8px;bottom:-8px;width:32px;height:32px;border-radius:11px;border:2px solid var(--modal);background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.cam:hover{transform:scale(1.1)}.cam svg{width:15px;height:15px}
.cam.rm{top:-8px;bottom:auto;background:var(--bad);color:#fff;width:26px;height:26px;border-radius:9px}.cam.rm svg{width:12px;height:12px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ftile{border:1px solid var(--border);background:var(--input);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;position:relative;display:block}
.ftile:hover{transform:translateY(-3px);border-color:var(--accent)}
.ftile .th{height:110px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,transparent);position:relative}
.ftile .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.ftile .th svg{width:36px;height:36px;color:var(--accent)}
.ftile .ext{position:absolute;bottom:10px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--accent)}
.ftile .nm{padding:8px 10px 2px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile .mt{padding:0 10px 9px;font-size:11px;color:var(--muted)}
.ftile .del{position:absolute;top:6px;right:6px;background:var(--modal)}
.ftile.up{border-style:dashed;border-width:2px;min-height:160px;color:var(--muted);align-items:center;justify-content:center}
.ftile.up svg{width:26px;height:26px}
.fbtn{margin-top:12px}
.preview{margin-bottom:12px}
.preview img{max-width:100%;max-height:68vh;display:block;margin:0 auto;border-radius:12px;background:#fff}
.preview iframe{width:100%;height:68vh;border:0;border-radius:12px;background:#fff}
.preview pre{white-space:pre-wrap;max-height:60vh;overflow:auto;background:var(--input);padding:16px;border-radius:12px;font-size:13px;line-height:1.6}
/* resolution document */
.doc{padding:34px clamp(16px,5vw,56px);line-height:1.8;font-size:15px;max-width:1000px;margin:0 auto;width:100%}
.doc.bn{font-family:'Hind Siliguri','Plus Jakarta Sans',sans-serif;font-size:16.5px}
.doc-banner{text-align:center;font-weight:800;font-size:18px;border:2px solid var(--border);border-radius:16px;padding:12px 18px;max-width:560px;margin:0 auto 18px;background:var(--input)}
.doc-title{text-align:center;font-weight:800;font-size:20px;margin:24px auto 14px;padding:4px 28px;border-left:4px solid var(--accent);border-right:4px solid var(--accent);width:max-content;max-width:100%}
.doc h3{margin:20px 0 6px;font-size:16px}
.rule{display:flex;gap:10px;align-items:flex-start;padding:5px 8px;border-radius:10px;transition:background .2s}
.rule:hover{background:var(--input)}
.rule .rn{font-weight:800;min-width:28px;flex:none}
.rule .rt{flex:1;min-width:0}
.rule .rsub{padding-left:22px}
.rule .racts{gap:4px;flex:none}
.sign-tbl td,.sign-tbl th{white-space:normal}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.idgrid{grid-template-columns:1fr}}
.idcard{border:1px dashed var(--border);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;background:var(--input)}
.idcard.has{border-style:solid;border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.idcard .th{width:74px;height:52px;border-radius:9px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--accent)}
.idcard .th img{width:100%;height:100%;object-fit:cover}
.idcard .grow{flex:1;min-width:0}.idcard .grow b{display:block;font-size:13px}.idcard .grow small{color:var(--muted);font-size:11.5px}
.idcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.warnbox{padding:12px 14px;border-radius:13px;font-size:12.5px;background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);max-height:180px;overflow:auto}
.warnbox li{margin-left:18px}
/* members */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{padding:16px;cursor:pointer;transition:transform .25s,border-color .25s}
.mcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.mcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px}
.mcard .acts{display:flex;gap:8px;margin-top:14px}
.mcard .acts .btn{flex:1}
.mini-cal{display:flex;gap:3px;margin-top:12px}
.mini-cal i{flex:1;height:7px;border-radius:3px;background:var(--input)}
.mini-cal i.paid{background:var(--good)}.mini-cal i.late{background:var(--warn)}.mini-cal i.unpaid{background:var(--bad)}.mini-cal i.partial{background:var(--info)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.cal{grid-template-columns:repeat(3,1fr)}}
.cc{padding:11px;border-radius:14px;border:1px solid var(--border);background:var(--input);cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;min-height:88px;--c:var(--muted)}
.cc:hover{transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 30%,transparent)}
.cc b{font-size:13px}.cc .a{font-weight:800;font-size:14px;margin-top:6px}.cc .d{font-size:11px;color:var(--muted);margin-top:2px}
.cc .st{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.cc .st svg{width:13px;height:13px;stroke-width:3}
.cc.paid{--c:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--input));border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.cc.late{--c:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--input));border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.cc.unpaid{--c:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--input));border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.cc.partial{--c:var(--info);background:color-mix(in srgb,var(--info) 9%,var(--input));border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.cc.future,.cc.na{opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--input);border:1px solid var(--border);width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;font-family:inherit;padding:7px 14px;border-radius:9px;cursor:pointer;transition:all .2s;white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}

function rateFor(m){let r=0;[...S().rates].sort((a,b)=>a.from<b.from?-1:1).forEach(x=>{if(x.from<=m)r=+x.amount});return r}

  const cm=curMonth();if(m>cm)return{s:'future',paid:0,due:rateFor(m)};if(m<memberStart(mem))return{s:'na',paid:0,due:0};
  const ps=monthPays(mem.id,m),paid=sum(ps,p=>p.amount),due=rateFor(m),last=ps.map(p=>p.date).sort().pop();
  if(!paid&&m<trackStart())return{s:'norec',paid:0,due:0,ps};
  if(due>0&&paid>=due){const late=last>m+'-'+pad(S().dueDay);return{s:late?'late':'paid',paid,due,date:last,ps}}
  if(paid>0)return{s:'partial',paid,due,date:last,ps};

  monthsBetween(memberStart(mem),cm).forEach(m=>{const s=status(mem,m);if(s.s==='paid')paid++;else if(s.s==='late')late++;else if(s.s==='unpaid'){unpaid++;outstanding+=s.due}else if(s.s==='partial'){partial++;outstanding+=s.due-s.paid}});

function totals(){
  const monthly=sum(DB.payments.filter(p=>isMon(p)),p=>p.amount),down=sum(DB.payments.filter(p=>p.type==='Down Payment'),p=>p.amount);
  const opening=sum(DB.banks,b=>b.openingBalance),expenses=sum(DB.expenses,e=>e.amount),assetCost=sum(DB.assets,a=>a.cost);

function cashSeries(){const cm=curMonth();const months=monthsBetween(S().startMonth,cm);const E=ledgerEntries();let i=0,bal=sum(DB.banks,b=>b.openingBalance);const cash=[],nw=[];

    <div class="acts" onclick="event.stopPropagation()"><button class="btn ghost sm" onclick="openProfile('${m.id}','overview')">${icon('user')} Profile</button><button class="btn ghost sm" onclick="openProfile('${m.id}','calendar')">${icon('cal')} Calendar</button><button class="icon-btn sm admin-only" onclick="memberForm({...DB.members.find(x=>x.id==='${m.id}')})">${icon('edit')}</button></div></div>`}).join('')||'<div class="empty glass">No members found</div>'}</div>`};

function openProfile(id,tab='overview'){pv.id=id;pv.tab=tab;pv.year=+todayStr().slice(0,4);const m=DB.members.find(x=>x.id===id);if(!m)return;openModal('Member Profile',profileBody,{wide:true,after:profileAfter})}
function profileBody(){const m=DB.members.find(x=>x.id===pv.id);if(!m)return'<div class="empty">Member removed</div>';const st=memberStats(m),T=totals(),share=T.contrib?st.total/T.contrib*100:0;
  const tabs=[['overview','Overview'],['calendar','Payment Calendar'],['history','Payment History'],['documents','Documents ('+filesFor('member',m.id).length+')']];
  let inner='';
  if(pv.tab==='calendar'){const y0=+memberStart(m).slice(0,4),y1=Math.max(+curMonth().slice(0,4),y0);pv.year=Math.min(Math.max(pv.year,y0),y1);const yrs=[];for(let y=y0;y<=y1;y++)yrs.push(y);
    const months=Array.from({length:12},(_,i)=>pv.year+'-'+pad(i+1)),yp=y=>sum(DB.payments.filter(p=>p.memberId===m.id&&p.month.startsWith(String(y))),p=>p.amount);
    inner=`<div class="yheat">${yrs.map(y=>`<div class="yh-row ${y===pv.year?'on':''}" onclick="pv.year=${y};refresh()" title="Show ${y}"><b>${y}</b><div class="yh-cells">${Array.from({length:12},(_,i)=>{const mo=y+'-'+pad(i+1),st2=status(m,mo).s;return`<i class="hc ${st2}" title="${mLabel(mo)}: ${ST_LABEL[st2]}"></i>`}).join('')}</div><span>${TK(yp(y))}</span></div>`).join('')}</div>
    <div class="toolbar" style="justify-content:space-between;margin:16px 0 12px"><div class="yrs" style="margin:0">${yrs.map(y=>`<button class="ychip ${y===pv.year?'on':''}" onclick="pv.year=${y};refresh()">${y}</button>`).join('')}</div>${calLegend()}</div>
    <div class="cal">${months.map((mo,i)=>{const s=status(m,mo),dn=monthPays(m.id,mo,'Down'),fn=monthPays(m.id,mo,'Fine'),lateD=s.s==='late'?Math.round((new Date(s.date)-new Date(mo+'-'+pad(S().dueDay)))/864e5):0,fine=s.s==='late'?fineFor(mo,s.date):0;
      return`<div class="cc ${s.s}" style="--i:${i}" data-n="${pad(i+1)}" onclick="calClick('${m.id}','${mo}')"><span class="st">${icon(s.s==='paid'||s.s==='late'?'check':s.s==='unpaid'?'x':s.s==='partial'||s.s==='pending'?'clock':'cal')}</span><b>${MNF[i]}</b><div class="a">${s.paid?TK(s.paid):s.s==='unpaid'||s.s==='pending'?TK(s.due):'—'}</div><div class="d">${s.date?'Paid '+dLabel(s.date):s.s==='unpaid'?'Not paid':ST_LABEL[s.s]}${lateD?` · ${lateD}d late`:''}</div>${fine?`<span class="pill">Fine ${TK(fine)}${fn.length?' ✓':''}</span>`:''}${dn.length?`<span class="pill">+ Down ${TK(sum(dn,p=>p.amount))}</span>`:''}</div>`}).join('')}</div>
    <div class="sub" style="margin-top:12px">${pv.year}: ${TK(yp(pv.year))} paid · due by the ${S().dueDay}th of each month. ${isAdmin?'Click any month to record or edit its payment.':'Click a month to see its details.'}</div>`}
  else if(pv.tab==='history'){const ps=DB.payments.filter(p=>p.memberId===m.id).sort((a,b)=>a.date<b.date?1:-1);
    inner=`<div class="toolbar" style="margin-bottom:10px;justify-content:space-between"><span class="sub">${ps.length} payments · ${st.downCount} down payments</span><button class="btn primary sm admin-only" onclick="paymentForm({memberId:'${m.id}'})">${icon('plus')} Add Payment</button></div><div class="tw"><table class="tbl"><thead><tr><th>Paid on</th><th>For month</th><th>Type</th><th>Bank</th><th>Status</th><th class="r">Amount</th><th class="admin-only"></th></tr></thead><tbody>${ps.map(p=>{const late=isMon(p)&&p.date>p.month+'-'+pad(S().dueDay);return`<tr><td>${dLabel(p.date)}</td><td>${mLabel(p.month)}</td><td>${p.type==='Down Payment'?'<span class="badge b-acc">Down Payment</span>':p.type==='Fine'?'<span class="badge b-late">Fine</span>':'Monthly'}</td><td>${esc(bankName(p.bankId))}</td><td>${isMon(p)?badge(late?'late':'paid'):'—'}</td><td class="r"><b>${TK(p.amount)}</b></td><td class="admin-only" style="display:table-cell"><button class="icon-btn sm admin-only" onclick="editRec('payments','${p.id}')">${icon('edit')}</button> <button class="icon-btn sm admin-only" onclick="delRec('payments','${p.id}','payment')">${icon('trash')}</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No payments yet</td></tr>'}</tbody></table></div>`}
  else if(pv.tab==='documents'){inner=`<h2 style="margin-bottom:10px">ID documents</h2>${idSection(m)}<h2 style="margin:20px 0 10px">Other documents</h2>`+docsGrid('member',m.id)}
  else{inner=`<div class="g11"><div><h2 style="margin-bottom:10px">Contribution by year</h2><div class="chart-box sm"><canvas id="cMemYear"></canvas></div></div><div><h2 style="margin-bottom:10px">Details</h2><div class="statement">
    <div class="ln"><span class="muted">Member No.</span><b>${esc(m.memberNo||'—')}</b></div><div class="ln"><span class="muted">Name (বাংলা)</span><b class="bn">${esc(m.nameBn||'—')}</b></div><div class="ln"><span class="muted">Father's name</span><b>${esc(m.fatherName||'—')}${m.fatherNameBn?' · '+esc(m.fatherNameBn):''}</b></div><div class="ln"><span class="muted">Share</span><b>${esc(m.share||100)}%</b></div><div class="ln"><span class="muted">Phone</span><b>${esc(m.phone||'—')}</b></div><div class="ln"><span class="muted">Email</span><b>${esc(m.email||'—')}</b></div><div class="ln"><span class="muted">Joined</span><b>${dLabel(m.joinDate)}</b></div><div class="ln"><span class="muted">Usual bank</span><b>${esc(bankName(m.bankId))}</b></div><div class="ln"><span class="muted">Occupation</span><b>${esc(m.occupation||'—')}</b></div><div class="ln"><span class="muted">Address</span><b style="white-space:normal;text-align:right">${esc(m.address||'—')}</b></div><div class="ln"><span class="muted">Nominee</span><b style="white-space:normal;text-align:right">${esc(m.nominee||'—')}${m.nomineeRelation?' ('+esc(m.nomineeRelation)+')':''}${m.nomineeBn?'<br><span class="muted">'+esc(m.nomineeBn)+'</span>':''}</b></div><div class="ln"><span class="muted">Last payment</span><b>${dLabel(st.last)}</b></div><div class="ln"><span class="muted">Share of fund</span><b>${share.toFixed(2)}%</b></div><div class="ln"><span class="muted">Equity value (share × net worth)</span><b>${TK(share/100*T.netWorth)}</b></div></div></div></div><h2 style="margin:20px 0 10px">ID documents</h2>${idSection(m)}`}
  return`<div class="who" style="gap:18px;margin-bottom:18px;flex-wrap:wrap"><div class="avwrap">${avatar(m,'lg')}<button class="cam admin-only" title="Upload photo" onclick="changePhoto('${m.id}')">${icon('camera')}</button>${m.photo?`<button class="cam rm admin-only" title="Remove photo" onclick="removePhoto('${m.id}')">${icon('x')}</button>`:''}</div><div style="flex:1;min-width:180px"><h1>${esc(m.name)}</h1>${m.nameBn?`<div style="font-family:'Hind Siliguri',sans-serif;font-weight:600">${esc(m.nameBn)}</div>`:''}<div class="sub">${[m.phone,m.email,'Member since '+mLabel(memberStart(m))].filter(Boolean).map(esc).join(' · ')}</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${m.status==='Inactive'?'<span class="badge b-na">Inactive</span>':'<span class="badge b-paid">Active</span>'}${badge(status(m,curMonth()).s)}</div></div><div style="display:flex;gap:8px"><button class="btn primary sm admin-only" onclick="paymentForm({memberId:'${m.id}'})">${icon('plus')} Payment</button><button class="btn ghost sm admin-only" onclick="memberForm({...DB.members.find(x=>x.id==='${m.id}')})">${icon('edit')} Edit</button><button class="icon-btn sm admin-only" onclick="delMember('${m.id}')">${icon('trash')}</button></div></div>
  <div class="stats" style="margin-bottom:16px"><div class="stat"><small>Total paid</small><div>${TK(st.total)}</div></div><div class="stat"><small>Monthly</small><div>${TK(st.monthly)}</div></div><div class="stat"><small>Down payments</small><div>${TK(st.down)}</div></div><div class="stat"><small>Payments made</small><div>${st.count}</div></div><div class="stat"><small>Late months</small><div class="${st.late?'warn':''}">${st.late}</div></div><div class="stat"><small>On-time rate</small><div class="${st.onTime>=80?'good':'warn'}">${st.onTime}%</div></div><div class="stat"><small>Outstanding</small><div class="${st.outstanding?'bad':'good'}">${TK(st.outstanding)}</div></div><div class="stat"><small>Fines due</small><div class="${st.fineBal?'warn':'good'}">${TK(st.fineBal)}</div></div></div>
  <div class="tabs" style="margin-bottom:16px">${tabs.map(([k,l])=>`<button class="${pv.tab===k?'on':''}" onclick="pv.tab='${k}';refresh()">${l}</button>`).join('')}</div>${inner}`}
function profileAfter(){if(pv.tab!=='overview')return;const m=DB.members.find(x=>x.id===pv.id);if(!m)return;const y0=+memberStart(m).slice(0,4),y1=+curMonth().slice(0,4);const ys=[];for(let y=y0;y<=y1;y++)ys.push(y);
  if(charts.cMemYear)charts.cMemYear.destroy();
  mk('cMemYear',{type:'bar',data:{labels:ys,datasets:[{label:'Monthly',data:ys.map(y=>sum(DB.payments.filter(p=>p.memberId===m.id&&isMon(p)&&p.month.startsWith(y)),p=>p.amount)),backgroundColor:alpha(memberColor(m.id),.85),borderRadius:6,stack:'a'},{label:'Down',data:ys.map(y=>sum(DB.payments.filter(p=>p.memberId===m.id&&p.type==='Down Payment'&&p.month.startsWith(y)),p=>p.amount)),backgroundColor:alpha(cv('--accent2'),.6),borderRadius:6,stack:'a'}]},options:baseOpts({scales:{y:{...yTK,stacked:true},x:{stacked:true,grid:{display:false}}}})})}
function calClick(mid,mo){const m=DB.members.find(x=>x.id===mid),s=status(m,mo),ps=DB.payments.filter(p=>p.memberId===mid&&p.month===mo);
  if(s.s==='na'){toast('Member had not joined in '+mLabel(mo),'warn');return}if(s.s==='future'&&!isAdmin){toast(mLabel(mo)+' has not started yet','warn');return}
  openModal(`${esc(m.name)} · ${mLabel(mo)}`,()=>{const ps2=DB.payments.filter(p=>p.memberId===mid&&p.month===mo),s2=status(m,mo);return`<div class="stats" style="margin-bottom:14px"><div class="stat"><small>Status</small><div>${badge(s2.s)}</div></div><div class="stat"><small>Due</small><div>${TK(s2.due)}</div></div><div class="stat"><small>Paid</small><div>${TK(s2.paid)}</div></div></div>
  ${ps2.length?`<div class="list">${ps2.map(p=>`<div class="li"><div class="tico in">${icon('arrowIn')}</div><div class="grow"><b>${p.type} · ${TK(p.amount)}</b><small>${dLabel(p.date)} · ${esc(bankName(p.bankId))}${p.note?' · '+esc(p.note):''}</small></div><button class="icon-btn sm admin-only" onclick="editRec('payments','${p.id}')">${icon('edit')}</button><button class="icon-btn sm admin-only" onclick="delRec('payments','${p.id}','payment')">${icon('trash')}</button></div>`).join('')}</div>`:'<div class="empty">No payment recorded for this month</div>'}
  <div class="modal-actions admin-only" style="display:flex"><button class="btn ghost" onclick="paymentForm({memberId:'${mid}',month:'${mo}',type:'Down Payment'})">${icon('plus')} Down Payment</button>${s2.paid<s2.due?`<button class="btn primary" onclick="paymentForm({memberId:'${mid}',month:'${mo}',amount:${s2.due-s2.paid}})">${icon('check')} Record ${TK(s2.due-s2.paid)}</button>`:''}</div>`})}

/* ---- quick pay ---- */
const yearsList=()=>{const a=[];for(let y=+S().startMonth.slice(0,4);y<=+todayStr().slice(0,4);y++)a.push(y);return a};
function monthCollect(mo,down){const ms=activeMembers().filter(x=>memberStart(x)<=mo);if(!ms.length)return 0;return ms.filter(x=>down?monthPays(x.id,mo,'Down').length:['paid','late'].includes(status(x,mo).s)).length/ms.length}
function qpYear(y){qp.year=y;qp.month=y+'-'+qp.month.slice(5);if(qp.month<S().startMonth)qp.month=S().startMonth;qp.sel.clear();render()}
function qpPicker(){const down=qp.mode==='down';return`<div class="yrs">${yearsList().map(y=>`<button class="ychip ${qp.year===y?'on':''}" onclick="qpYear(${y})">${y}</button>`).join('')}</div>
  ${qp.mode==='grid'?'':`<div class="mchips">${MN.map((n,i)=>{const mo=qp.year+'-'+pad(i+1),fut=mo>curMonth(),pre=mo<S().startMonth,pc=fut||pre?0:monthCollect(mo,down);return`<button class="mchip ${qp.month===mo?'on':''} ${fut?'fut':''}" ${pre?'disabled':''} onclick="qp.month='${mo}';render()" style="--p:${Math.round(pc*100)}%"><span>${n}</span><small>${pre?'—':fut?'upcoming':Math.round(pc*100)+'% paid'}</small>${down&&(i===5||i===11)?'<em>★</em>':''}</button>`}).join('')}</div>`}`}
PAGES.quickpay=()=>{const mode=qp.mode;qp.type=mode==='down'?'Down Payment':'Monthly';if(+qp.month.slice(0,4)!==qp.year)qp.year=+qp.month.slice(0,4);
  const tabs=`<div class="tabs"><button class="${mode==='monthly'?'on':''}" onclick="qp.mode='monthly';render()">Monthly</button><button class="${mode==='down'?'on':''}" onclick="qp.mode='down';render()">Down Payment</button><button class="${mode==='grid'?'on':''}" onclick="qp.mode='grid';render()">Year Grid · bulk / yearly</button></div>`;
  return`${isAdmin?'':`<div class="note">${icon('lock')} Quick Pay is for the admin. You can see who has paid, but recording payments needs the admin password. <button class="btn primary sm" style="margin-left:8px" onclick="openLogin()">Admin Login</button></div>`}
  <div class="glass card"><div class="toolbar" style="justify-content:space-between;margin-bottom:14px">${tabs}<span class="sub">${mode==='grid'?'Tick many months for many members and pay them in one go — best for entering past years.':mode==='down'?'★ June and December are the usual down-payment months (Rule 4).':'Choose any year and month, then record each member.'}</span></div>${qpPicker()}</div>`+(mode==='grid'?qpGrid():qpMonth())};
function qpMonth(){const m=qp.month,isDown=qp.type==='Down Payment';const rows=activeMembers().filter(x=>memberStart(x)<=m).sort((a,b)=>(+a.memberNo||99)-(+b.memberNo||99));
  let paidN=0,col=0,exp=0;rows.forEach(x=>{if(isDown){const d=monthPays(x.id,m,'Down');if(d.length){paidN++;col+=sum(d,p=>p.amount)}exp+=+S().defaultDown}else{const s=status(x,m);if(s.s==='paid'||s.s==='late')paidN++;col+=s.paid;exp+=rateFor(m)}});
  const pct=rows.length?Math.round(paidN/rows.length*100):0;
  return`<div class="glass card"><div class="stats"><div class="stat"><small>Paid</small><div class="good">${paidN} / ${rows.length}</div></div><div class="stat"><small>Collected</small><div>${TK(col)}</div></div><div class="stat"><small>Expected</small><div>${TK(exp)}</div></div><div class="stat"><small>Remaining</small><div class="${exp-col>0?'bad':'good'}">${TK(Math.max(0,exp-col))}</div></div></div><div class="prog" style="margin-top:14px"><i style="width:${pct}%"></i></div></div>
  <div class="glass card"><div class="toolbar" style="margin-bottom:12px;justify-content:space-between"><div><h2>${isDown?'Down payments':'Monthly contributions'} · ${mLabel(m)}</h2><div class="sub">${isDown?'Enter each member\'s down payment amount':'Rate for this month: '+TK(rateFor(m))}. Tick several rows to pay them all at once.</div></div>
    <div class="toolbar"><label class="fld" style="flex-direction:row;align-items:center"><span>Date for all</span><input type="date" value="${qp.date}" style="width:150px" onchange="qp.date=this.value;$$('.qd').forEach(i=>{i.value=this.value;qpFine(i.id.slice(3))})"></label><button class="btn ghost" onclick="$$('.qd').forEach(i=>{i.value='${m}-'+pad(Math.min(+S().dueDay||5,28));qpFine(i.id.slice(3))})" ${isAdmin?'':'disabled'} title="Set every date to the due day of ${mLabel(m)}">On-time dates</button><button class="btn primary" onclick="paySelected()" ${isAdmin?'':'disabled'}>${icon('zap')} Pay Selected</button></div></div>
  <div class="tw"><table class="tbl"><thead><tr><th><input type="checkbox" onchange="$$('.qc:not(:disabled)').forEach(c=>c.checked=this.checked)" ${isAdmin?'':'disabled'}></th><th>Member</th><th>Status</th><th>Amount (৳)</th><th>Date</th><th>Late fine</th><th>Bank</th><th class="r">Action</th></tr></thead><tbody>
  ${rows.map(x=>{let st,paid=0,remain;if(isDown){const d=monthPays(x.id,m,'Down');paid=sum(d,p=>p.amount);st=d.length?'paid':'unpaid';remain=+S().defaultDown}else{const s=status(x,m);st=s.s;paid=s.paid;remain=Math.max(0,rateFor(m)-s.paid)}
    const done=st==='paid'||st==='late';const lastP=(isDown?monthPays(x.id,m,'Down'):monthPays(x.id,m)).map(p=>p.date).sort().pop();
    return`<tr id="qr-${x.id}"><td><input type="checkbox" class="qc" value="${x.id}" ${done||!isAdmin?'disabled':''}></td><td><div class="who" style="cursor:pointer" onclick="openProfile('${x.id}','calendar')">${avatar(x)}<div><b>${esc(x.name)}</b><div class="sub">${paid?'Paid '+TK(paid):'Nothing paid'}</div></div></div></td><td>${badge(st)}</td>
    ${done?`<td colspan="4" class="muted">${TK(paid)} on ${dLabel(lastP)}</td><td class="r"><button class="btn success sm" disabled>${icon('check')} Paid</button> <button class="icon-btn sm admin-only" title="Undo" onclick="undoPay('${x.id}')">${icon('x')}</button></td>`:
    `<td><input type="number" class="qa" id="qa-${x.id}" value="${remain}" min="0" style="width:110px" ${isAdmin?'':'disabled'}></td><td><input type="date" class="qd" id="qd-${x.id}" value="${qp.date}" style="width:150px" oninput="qpFine('${x.id}')" ${isAdmin?'':'disabled'}></td><td>${isDown?'<span class="muted">—</span>':`<input type="number" class="qf" id="qf-${x.id}" value="${fineFor(m,qp.date)}" min="0" style="width:90px" title="Rule 3: 10% on the 6th, then ৳100 per day" ${isAdmin?'':'disabled'}>`}</td><td><select id="qb-${x.id}" style="width:170px" ${isAdmin?'':'disabled'}>${bankOpts().map(([v,l])=>`<option value="${v}" ${v===(qp.bank||x.bankId||'cash')?'selected':''}>${esc(l)}</option>`).join('')}</select></td><td class="r"><button class="btn primary sm" onclick="payOne('${x.id}')" ${isAdmin?'':'disabled'}>${icon('check')} Pay</button></td>`}</tr>`}).join('')||'<tr><td colspan="8" class="empty">No active members for this month</td></tr>'}
  </tbody></table></div></div>`}
const gridMonths=()=>Array.from({length:12},(_,i)=>qp.year+'-'+pad(i+1)).filter(mo=>mo>=S().startMonth);
const canSel=(m,mo)=>!['paid','late','na'].includes(status(m,mo).s);
function qpGrid(){const y=qp.year,months=gridMonths(),ms=MEM().filter(x=>x.status!=='Inactive');
  for(const k of [...qp.sel]){const[mid,mo]=k.split('|'),mm=DB.members.find(x=>x.id===mid);if(!mm||!canSel(mm,mo))qp.sel.delete(k)}
  const selAmt=[...qp.sel].reduce((a,k)=>{const[mid,mo]=k.split('|');const mm=DB.members.find(x=>x.id===mid);return a+Math.max(0,rateFor(mo)-status(mm,mo).paid)},0);
  return`<div class="glass card"><div class="toolbar" style="justify-content:space-between;margin-bottom:12px"><div><h2>${y} · Year grid</h2><div class="sub">Click a cell to select that month · click a name to select the member's whole year · click a month heading to select everyone</div></div>${calLegend()}</div>
  <div class="toolbar" style="margin-bottom:12px"><button class="btn ghost sm" onclick="qpSelAll()" ${isAdmin?'':'disabled'}>Select all unpaid in ${y}</button><button class="btn ghost sm" onclick="qp.sel.clear();render()">Clear</button>
   <label class="fld" style="flex-direction:row;align-items:center;gap:6px"><span>Paid on</span><select style="width:auto" onchange="qp.dmode=this.value;render()"><option value="due" ${qp.dmode==='due'?'selected':''}>Due day of each month (on time)</option><option value="date" ${qp.dmode==='date'?'selected':''}>One date for all</option></select></label>
   ${qp.dmode==='date'?`<input type="date" value="${qp.gdate}" style="width:150px" onchange="qp.gdate=this.value;render()">`:''}
   <select style="width:auto" onchange="qp.gbank=this.value"><option value="">Each member's usual account</option>${bankOpts().map(([v,l])=>`<option value="${v}" ${qp.gbank===v?'selected':''}>${esc(l)}</option>`).join('')}</select>
   <span class="grow"></span><button class="btn primary" onclick="qpPayGrid()" ${isAdmin&&qp.sel.size?'':'disabled'}>${icon('zap')} Pay ${qp.sel.size} month(s) · ${TK(selAmt)}</button></div>

async function qpPayGrid(){if(!guard())return;const recs=[];
  [...qp.sel].sort().forEach(k=>{const[mid,mo]=k.split('|');const mm=DB.members.find(x=>x.id===mid);if(!mm)return;const amt=Math.max(0,rateFor(mo)-status(mm,mo).paid);if(!(amt>0))return;
    const date=qp.dmode==='date'?(qp.gdate||todayStr()):mo+'-'+pad(Math.min(+S().dueDay||5,28)),bankId=qp.gbank||mm.bankId||'cash';
    recs.push({id:uid(),memberId:mid,month:mo,type:'Monthly',amount:amt,date,bankId,note:'Quick Pay'});const f=fineFor(mo,date);if(f>0)recs.push({id:uid(),memberId:mid,month:mo,type:'Fine',amount:f,date,bankId,note:'Late fine'})});
  if(!recs.length){toast('Nothing to pay','warn');return}const fines=recs.filter(r=>r.type==='Fine'),mons=recs.filter(r=>r.type!=='Fine');
  if(!await confirmBox(`Record <b>${mons.length}</b> monthly payment(s) totalling <b>${TK(sum(mons,r=>r.amount))}</b>${fines.length?` plus <b>${fines.length}</b> late fine(s) of ${TK(sum(fines,r=>r.amount))}`:''}?`,'Pay all',false))return;
  let ok=true;for(let i=0;i<recs.length&&ok;i+=250)ok=await upsertMany('payments',recs.slice(i,i+250),'');if(ok){qp.sel.clear();toast(`${mons.length} months recorded`);render()}}

function qpRecs(id){const amt=+$('#qa-'+id).value;if(!(amt>0))return[];const date=$('#qd-'+id).value||todayStr(),bankId=$('#qb-'+id).value;const r=[{memberId:id,month:qp.month,type:qp.type,amount:amt,date,bankId,note:'Quick Pay'}];const fe=$('#qf-'+id),fine=fe?+fe.value:0;if(fine>0)r.push({memberId:id,month:qp.month,type:'Fine',amount:fine,date,bankId,note:'Late fine'});return r}
async function payOne(id){if(!guard())return;const r=qpRecs(id);if(!r.length){toast('Enter an amount','warn');return}const n=DB.members.find(x=>x.id===id).name;await upsertMany('payments',r,`${n} · ${TK(sum(r,x=>x.amount))} paid`)}
async function paySelected(){if(!guard())return;const ids=$$('.qc:checked').map(c=>c.value);if(!ids.length){toast('Tick at least one member','warn');return}const recs=ids.flatMap(qpRecs);if(!recs.length){toast('Enter amounts first','warn');return}
  if(await confirmBox(`Record ${recs.length} payment(s) totalling <b>${TK(sum(recs,r=>r.amount))}</b> for ${mLabel(qp.month)}?`,'Pay all',false))upsertMany('payments',recs,`${recs.length} payments recorded`)}
async function undoPay(id){const ps=qp.type==='Down Payment'?monthPays(id,qp.month,'Down'):monthPays(id,qp.month).concat(monthPays(id,qp.month,'Fine'));if(await confirmBox(`Remove ${ps.length} payment(s) for this member in ${mLabel(qp.month)}?`,'Remove'))remove('payments',ps.map(p=>p.id),'Payment removed')}

function holdersHTML(b){const h=String(b.holders||'').split(',').map(x=>x.trim()).filter(Boolean);return h.length?`<div class="chips">${h.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:'<span class="muted">—</span>'}
function fdrInfo(b){const bal=bankBalance(b.id),rec=sum(DB.income.filter(i=>i.bankId===b.id&&/interest/i.test(i.category)),i=>i.amount),principal=bal-rec;
  const o=b.openDate?new Date(b.openDate+'T00:00:00'):null,mt=b.maturity?new Date(b.maturity+'T00:00:00'):null,now=new Date(todayStr()+'T00:00:00');
  const years=o&&mt?Math.max(0,(mt-o)/(365.25*864e5)):1,expInt=principal*(+b.rate||0)/100*years,prog=o&&mt&&mt>o?Math.min(100,Math.max(0,(now-o)/(mt-o)*100)):0,days=mt?Math.ceil((mt-now)/864e5):null;
  return{bal,rec,principal,years,expInt,prog,days,matVal:principal+expInt}}

  <div class="statement" style="margin-top:8px"><div class="ln"><span class="muted">Expected interest${b.openDate&&b.maturity?'':' (1 yr)'}</span><b class="good">${TK(f.expInt)}</b></div><div class="ln"><span class="muted">Value at maturity</span><b>${TK(f.matVal)}</b></div><div class="ln" style="border:0"><span class="muted">Interest received so far</span><b>${TK(f.rec)}</b></div></div>
  <div class="sub">Holder(s): ${esc(b.holders||'—')}</div></div>`}

const fsize=b=>{b=+b||0;return b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?Math.round(b/1024)+' KB':b+' B'};

function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res(i.files[0]||null);i.remove()};i.click()})}
const readAsDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read file'));r.readAsDataURL(f)});
async function resizeImage(file,max,q=.85,square=false){const src=await readAsDataURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Not a supported image'));i.src=src});
  let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;if(square){const z=Math.min(sw,sh);sx=(sw-z)/2;sy=(sh-z)/2;sw=sh=z}
  const sc=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
function dataURLtoBlob(d){const k=d.indexOf(','),h=d.slice(0,k),b=d.slice(k+1),mime=(h.match(/data:([^;,]+)/)||[])[1]||'application/octet-stream';if(!/;base64/.test(h))return new Blob([decodeURIComponent(b)],{type:mime});const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Blob([u],{type:mime})}
const b64size=d=>{const k=d.indexOf(','),h=d.slice(0,k),b=d.slice(k+1);return /;base64/.test(h)?Math.round(b.length*3/4):decodeURIComponent(b).length};

async function uploadDoc(t,id,cat=''){if(!guard())return;const f=await pickFile('image/*,application/pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.ppt,.pptx');if(!f)return;
  let data,mime=f.type||'application/octet-stream',name=f.name;busy(true);

    const size=b64size(data);if(size>MAX_UP){toast(`File too large — max ${fsize(MAX_UP)}${IS_GAS?'':' in demo mode'}`,'warn');return}
    const rec={id:uid(),fileId:'',name,mime,size,linkType:t,linkId:id,category:cat,uploadedAt:todayStr(),url:'',note:''};

function dataText(d){const k=d.indexOf(','),h=d.slice(0,k),b=d.slice(k+1);if(!/;base64/.test(h))return decodeURIComponent(b);const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
async function openFile(id){const f=DB.files.find(x=>x.id===id);if(!f)return;if(isIdFile(f)&&!isAdmin){toast('ID cards can only be opened by the admin','warn');openLogin();return}let data=f.url||'';

function loadXLSX(){if(window.XLSX)return Promise.resolve();return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=XLSX_URL;sc.onload=res;sc.onerror=()=>rej(new Error('Could not load the Excel library — check your internet connection'));document.head.appendChild(sc)})}
const normName=v=>String(v||'').toLowerCase().replace(/\b(md|mohammad|mohammed|muhammad|mst)\b/g,'').replace(/[^a-zঀ-৿]/g,'');
function findMember(no,name){if(no!==''&&no!=null&&!isNaN(+no)&&+no>0){const m=DB.members.find(x=>+x.memberNo===+no);if(m)return m}const n=normName(name);if(!n)return null;return DB.members.find(x=>normName(x.name)===n||normName(x.nameBn)===n)||null}
function xlDate(v){if(v==null||v==='')return'';if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  if(typeof v==='number'){if(v>20000&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return d.y+'-'+pad(d.m)+'-'+pad(d.d)}return''}
  const t=String(v).trim();let m;if((m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/)))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  const p=Date.parse(t);if(!isNaN(p)){const d=new Date(p);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}return''}
function xlMonth(v){if(v==null||v==='')return'';if(typeof v==='number')return v>20000?xlDate(v).slice(0,7):'';if(v instanceof Date)return xlDate(v).slice(0,7);
  const t=String(v).trim();let m;if((m=t.match(/^(\d{4})[-\/.](\d{1,2})$/)))return m[1]+'-'+pad(+m[2]);if((m=t.match(/^(\d{1,2})[-\/.](\d{4})$/)))return m[2]+'-'+pad(+m[1]);
  if((m=t.match(/^([A-Za-z]{3,})[\s\-',.]*(\d{2,4})$/))){const i=MN.findIndex(x=>m[1].toLowerCase().startsWith(x.toLowerCase()));if(i>=0){let y=+m[2];if(y<100)y+=2000;return y+'-'+pad(i+1)}}
  const d=xlDate(t);return d?d.slice(0,7):''}
const xlNum=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v??'').replace(/tk|taka|[,৳\s]/gi,''));return isNaN(n)?0:n};
async function downloadTemplate(){busy(true);try{await loadXLSX();const wb=XLSX.utils.book_new(),months=monthsBetween(S().startMonth,curMonth()),ms=MEM();
  const add=(name,rows,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
  add('Instructions',[['UNIQUE TWELVE – EXCEL IMPORT TEMPLATE'],[''],['1. "Amounts": type the monthly contribution each member paid under each month (e.g. 2000 or 3000). Leave blank if not paid.'],['2. "Paid Day" (optional): the day of the month it was paid, e.g. 4, or a full date like 2023-06-08. Blank = on time ('+S().dueDay+'th).'],['3. "Payments": one row per payment for Down Payments, Fines, or a monthly payment with an exact date. Type = Monthly / Down Payment / Fine.'],['4. "Expenses", "Income" and "Banks": optional, one row each. Banks are created first, so you can use their names in the other sheets.'],['5. In the dashboard: log in as admin → Reports & Backup → Import Excel. You get a preview before anything is saved.'],[''],['Months: YYYY-MM (2023-05). Dates: YYYY-MM-DD or DD/MM/YYYY. Members are matched by No. (1–12) or by English name.'],['Months that already have a payment are skipped, so importing the same file twice is safe. This file also works as an export of your current data.']],[120]);
  const head=['No','Member',...months];
  add('Amounts',[head,...ms.map(m=>[m.memberNo||'',m.name,...months.map(mo=>sum(monthPays(m.id,mo),p=>p.amount)||'')])],[5,24,...months.map(()=>9)]);
  add('Paid Day',[head,...ms.map(m=>[m.memberNo||'',m.name,...months.map(mo=>{const d=monthPays(m.id,mo).map(p=>p.date).sort().pop();return d?(d.slice(0,7)===mo?+d.slice(8):d):''})])],[5,24,...months.map(()=>9)]);
  add('Payments',[['Member No','Member','Month (YYYY-MM)','Amount','Paid Date (YYYY-MM-DD)','Type (Monthly / Down Payment / Fine)','Bank','Note'],...DB.payments.filter(p=>!isMon(p)).sort((a,b)=>a.date<b.date?-1:1).map(p=>{const m=DB.members.find(x=>x.id===p.memberId)||{};return[m.memberNo||'',m.name||'',p.month,+p.amount,p.date,p.type,bankName(p.bankId),p.note||'']})],[10,24,16,10,22,34,22,24]);
  add('Expenses',[['Date (YYYY-MM-DD)','Category','Amount','Paid From (Bank)','Description'],...DB.expenses.map(e=>[e.date,e.category,+e.amount,bankName(e.bankId),e.note||''])],[18,24,10,22,36]);
  add('Income',[['Date (YYYY-MM-DD)','Source (FDR Interest / Bank Interest / Business Profit / Rent / Donation / Other)','Amount','Received Into (Bank)','Description'],...DB.income.map(i=>[i.date,i.category,+i.amount,bankName(i.bankId),i.note||''])],[18,44,10,22,36]);
  add('Banks',[['Name','Type (Savings/Current/FDR/DPS/Mobile Banking/Cash)','Account No','Branch','Opening Balance','Interest Rate %','Open Date','Maturity Date','Note','Account Title','Account Holders (comma separated)'],...DB.banks.map(b=>[b.name,b.type,b.accountNo||'',b.branch||'',+b.openingBalance||0,+b.rate||0,b.openDate||'',b.maturity||'',b.note||'',b.accountTitle||'',b.holders||''])],[24,40,16,14,14,14,12,14,20,20,40]);
  XLSX.writeFile(wb,'unique-twelve-data.xlsx');toast('Excel file downloaded')}catch(e){toast(errMsg(e),'bad')}finally{busy(false)}}
function sheetRows(wb,re){const n=wb.SheetNames.find(x=>re.test(x.trim()));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}):null}
function parseWorkbook(wb){const P={banks:[],payments:[],expenses:[],income:[],warn:[],skipped:0},dd=pad(Math.min(+S().dueDay||5,28));
  const byName={};DB.banks.forEach(b=>byName[b.name.trim().toLowerCase()]=b.id);
  const bankId=(name,def)=>{const k=String(name||'').trim().toLowerCase();if(!k)return def||'cash';if(byName[k])return byName[k];const b=DB.banks.find(x=>x.id===k||String(x.accountNo||'').trim().toLowerCase()===k);if(b)return b.id;P.warn.push(`Unknown bank "${name}" — used Cash in Hand`);byName[k]='cash';return'cash'};
  const B=sheetRows(wb,/^bank/i);if(B)B.slice(1).forEach(r=>{const name=String(r[0]||'').trim();if(!name)return;if(byName[name.toLowerCase()]){P.skipped++;return}const b={id:uid(),name,type:String(r[1]||'Savings').trim()||'Savings',accountNo:String(r[2]||''),branch:String(r[3]||''),openingBalance:xlNum(r[4]),rate:xlNum(r[5]),openDate:xlDate(r[6]),maturity:xlDate(r[7]),note:String(r[8]||''),accountTitle:String(r[9]||''),holders:String(r[10]||'')};P.banks.push(b);byName[name.toLowerCase()]=b.id});
  const dbMonthly=new Set(DB.payments.filter(isMon).map(p=>p.memberId+'|'+p.month)),gridMonthly=new Set();
  const seen=new Set(DB.payments.map(p=>[p.memberId,p.month,p.type,+p.amount,p.date].join('|')));
  const A=sheetRows(wb,/^amount/i),D=sheetRows(wb,/^paid\s*day/i);
  if(A&&A.length>1){const months=A[0].map((h,i)=>i<2?'':xlMonth(h)),dmon=D?D[0].map((h,i)=>i<2?'':xlMonth(h)):[],drow={};
    if(D)D.slice(1).forEach(r=>{const m=findMember(r[0],r[1]);if(m)drow[m.id]=r});
    A.slice(1).forEach((r,ri)=>{if(String(r[0]).trim()===''&&String(r[1]).trim()==='')return;const m=findMember(r[0],r[1]);if(!m){P.warn.push(`Amounts row ${ri+2}: member "${r[1]||r[0]}" not found`);return}
      months.forEach((mo,ci)=>{if(!mo)return;const amt=xlNum(r[ci]);if(!(amt>0))return;if(dbMonthly.has(m.id+'|'+mo)){P.skipped++;return}
        let date=mo+'-'+dd;const dr=drow[m.id],di=dmon.indexOf(mo),dv=dr&&di>=0?dr[di]:'';
        if(dv!==''&&dv!=null){if(typeof dv==='number'&&dv>=1&&dv<=31)date=mo+'-'+pad(Math.floor(dv));else if(/^\d{1,2}$/.test(String(dv).trim()))date=mo+'-'+pad(+String(dv).trim());else{const d=xlDate(dv);if(d)date=d;else P.warn.push(`Paid Day for ${m.name} ${mLabel(mo)} not understood: "${dv}"`)}}
        gridMonthly.add(m.id+'|'+mo);P.payments.push({id:uid(),memberId:m.id,month:mo,type:'Monthly',amount:amt,date,bankId:m.bankId||'cash',note:'Imported'})})})}
  const Lr=sheetRows(wb,/^payment/i);if(Lr)Lr.slice(1).forEach((r,ri)=>{if(r.every(c=>String(c).trim()===''))return;const row=ri+2,m=findMember(r[0],r[1]);if(!m){P.warn.push(`Payments row ${row}: member "${r[1]||r[0]}" not found`);return}
    let date=xlDate(r[4]);const mo=xlMonth(r[2])||(date?date.slice(0,7):''),amt=xlNum(r[3]);if(!mo||!(amt>0)){P.warn.push(`Payments row ${row}: month or amount missing`);return}if(!date)date=mo+'-'+dd;
    const tr=String(r[5]||'Monthly').trim().toLowerCase(),type=tr.startsWith('down')?'Down Payment':tr.startsWith('fine')?'Fine':'Monthly',key=[m.id,mo,type,amt,date].join('|');
    if(seen.has(key)||(type==='Monthly'&&(dbMonthly.has(m.id+'|'+mo)||gridMonthly.has(m.id+'|'+mo)))){P.skipped++;return}seen.add(key);
    P.payments.push({id:uid(),memberId:m.id,month:mo,type,amount:amt,date,bankId:bankId(r[6],m.bankId),note:String(r[7]||'Imported')})});
  const E=sheetRows(wb,/^expense/i);if(E){const ex=new Set(DB.expenses.map(e=>[e.date,+e.amount,e.category].join('|')));E.slice(1).forEach((r,ri)=>{if(r.every(c=>String(c).trim()===''))return;const date=xlDate(r[0]),amt=xlNum(r[2]),cat=String(r[1]||'Other').trim();if(!date||!(amt>0)){P.warn.push(`Expenses row ${ri+2}: date or amount missing`);return}const k=[date,amt,cat].join('|');if(ex.has(k)){P.skipped++;return}ex.add(k);P.expenses.push({id:uid(),date,category:cat,amount:amt,bankId:bankId(r[3],'cash'),note:String(r[4]||'')})})}
  const I=sheetRows(wb,/^income/i);if(I){const ex=new Set(DB.income.map(e=>[e.date,+e.amount,e.category].join('|')));I.slice(1).forEach((r,ri)=>{if(r.every(c=>String(c).trim()===''))return;const date=xlDate(r[0]),amt=xlNum(r[2]),cat=String(r[1]||'Other').trim();if(!date||!(amt>0)){P.warn.push(`Income row ${ri+2}: date or amount missing`);return}const k=[date,amt,cat].join('|');if(ex.has(k)){P.skipped++;return}ex.add(k);P.income.push({id:uid(),date,category:cat,amount:amt,bankId:bankId(r[3],'cash'),note:String(r[4]||'')})})}
  if(!A&&!Lr&&!E&&!B&&!I)P.warn.push('No sheets named Amounts, Paid Day, Payments, Expenses or Banks were found. Download the template to see the format.');
  return P}
async function importExcel(){if(!guard())return;const f=await pickFile('.xlsx,.xls,.csv');if(!f)return;busy(true);let P;
  try{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});P=parseWorkbook(wb)}catch(e){toast('Could not read the file: '+errMsg(e),'bad');return}finally{busy(false)}
  const by=t=>P.payments.filter(p=>p.type===t),st=(l,n,a)=>`<div class="stat"><small>${l}</small><div>${n}${a!=null?` <span class="muted" style="font-size:12px">${TK(a)}</span>`:''}</div></div>`,none=!P.banks.length&&!P.payments.length&&!P.expenses.length&&!P.income.length;
  const mn=id=>(DB.members.find(x=>x.id===id)||{}).name||'—';
  openModal('Import preview · '+esc(f.name),`<div class="stats" style="margin-bottom:14px">${st('Monthly payments',by('Monthly').length,sum(by('Monthly'),p=>p.amount))}${st('Down payments',by('Down Payment').length,sum(by('Down Payment'),p=>p.amount))}${st('Fines',by('Fine').length,sum(by('Fine'),p=>p.amount))}${st('Expenses',P.expenses.length,sum(P.expenses,e=>e.amount))}${st('Income',P.income.length,sum(P.income,e=>e.amount))}${st('New banks',P.banks.length)}${st('Skipped (already saved)',P.skipped)}</div>
  ${P.payments.length?`<div class="tw" style="max-height:260px;overflow:auto;margin-bottom:12px"><table class="tbl"><thead><tr><th>Member</th><th>Month</th><th>Type</th><th>Paid on</th><th class="r">Amount</th></tr></thead><tbody>${P.payments.slice(0,60).map(p=>`<tr><td>${esc(mn(p.memberId))}</td><td>${mLabel(p.month)}</td><td>${p.type}</td><td>${dLabel(p.date)}</td><td class="r">${TK(p.amount)}</td></tr>`).join('')}${P.payments.length>60?`<tr><td colspan="5" class="muted">…and ${P.payments.length-60} more</td></tr>`:''}</tbody></table></div>`:''}
  ${P.warn.length?`<div class="warnbox"><b>${P.warn.length} warning(s)</b><ul>${P.warn.slice(0,40).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}
  ${none?'<div class="empty">Nothing new to import.</div>':''}
  <div class="modal-actions"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="impGo" ${none?'disabled':''}>${icon('check')} Import ${P.payments.length+P.expenses.length+P.banks.length+P.income.length} records</button></div>`,{wide:true,after:b=>{b.querySelector('[data-x]').onclick=()=>closeModal();const g=b.querySelector('#impGo');g.onclick=async()=>{g.disabled=true;closeModal();
    const chunks=(a,n=250)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};let ok=true;
    if(P.banks.length)ok=await upsertMany('banks',P.banks,'')&&ok;for(const c of chunks(P.payments))ok=ok&&await upsertMany('payments',c,'');if(ok&&P.expenses.length)ok=await upsertMany('expenses',P.expenses,'');if(ok&&P.income.length)ok=await upsertMany('income',P.income,'');
    if(ok)toast(`Imported ${P.payments.length} payments, ${P.expenses.length} expenses, ${P.income.length} income, ${P.banks.length} banks`)}}})}

function restoreJSON(inp){if(!guard())return;const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!d.members||!d.payments)throw new Error('Not a Unique Twelve backup');
  if(!await confirmBox(`Restore backup with ${d.members.length} members and ${d.payments.length} payments? This replaces ALL current data.`,'Restore'))return;
  const keep=S().adminPassword;await run(async()=>{const n=normalize(d);n.settings.adminPassword=keep;await API.restore(n);DB=n},'Backup restored')}catch(e){toast(errMsg(e),'bad')}};rd.readAsText(f);inp.value=''}

PAGES.settings=()=>{if(!isAdmin)return`<div class="glass card empty" style="padding:60px 20px">${icon('lock')}<h2 style="margin:10px 0">Admin only</h2><p class="muted" style="margin-bottom:16px">Settings can only be changed by the admin.</p><button class="btn primary" onclick="openLogin()">${icon('unlock')} Admin Login</button></div>`;
  const s=S();return`<div class="g11"><div class="glass card"><h2 style="margin-bottom:14px">Samity details</h2><form id="sf">${formHTML([{k:'name',label:'Samity name',req:1},{k:'tagline',label:'Tagline'},{k:'startMonth',label:'Started from',type:'month',req:1},{k:'founded',label:'Founded on',type:'date'},{k:'address',label:'Address'},{k:'dueDay',label:'Monthly due day (late after this)',type:'number',req:1},{k:'defaultDown',label:'Default down payment (৳)',type:'number'},{k:'duesFrom',label:'Count unpaid dues from (blank = first recorded month)',type:'month'},{k:'fineEnabled',label:'Calculate late fines',type:'select',options:[['true','Yes'],['false','No']]},{k:'fineFrom',label:'Fines apply from month',type:'month'},{k:'finePct',label:'Fine on 6th (% of instalment)',type:'number'},{k:'fineDaily',label:'Daily fine from 7th (৳)',type:'number'}],{...s,fineEnabled:String(s.fineEnabled!==false&&s.fineEnabled!=='false')})}
    <h2 style="margin:20px 0 6px">Monthly rate history</h2><div class="sub" style="margin-bottom:10px">The rate applies from that month onward (e.g. ৳2,000 from Jul 2022, ৳3,000 later).</div><div id="rates">${s.rates.map((r,i)=>rateRow(r,i)).join('')}</div>
    <button type="button" class="btn ghost sm" onclick="addRateRow()">${icon('plus')} Add rate change</button><div class="modal-actions"><button class="btn primary">${icon('check')} Save settings</button></div></form></div>
  <div style="display:flex;flex-direction:column;gap:16px"><div class="glass card"><h2 style="margin-bottom:12px">Admin password</h2><form id="pf" class="toolbar"><input type="password" id="npw" class="grow" placeholder="New password (min 4 chars)" minlength="4" required style="flex:1"><button class="btn primary">Change</button></form></div>
  <div class="glass card"><h2 style="margin-bottom:6px">Data source</h2><p class="sub" style="margin-bottom:12px;line-height:1.6">${IS_FB?'Connected to Firebase (Firestore). Every change is saved instantly and everyone sees the same data.':IS_GAS?'Connected to Google Sheets through Apps Script. Every change is saved instantly to your spreadsheet (one sheet per table).':'Running as a standalone demo — data is saved in this browser only. Deploy with the included Code.gs to store data permanently in Google Sheets for free.'}</p>
    <div class="toolbar"><button class="btn primary" onclick="importExcel()">${icon('xls')} Import Excel</button><button class="btn ghost" onclick="downloadTemplate()">${icon('download')} Excel template</button><button class="btn ghost" onclick="resetStart()">${icon('users')} Reset to starting data</button><button class="btn danger" onclick="clearAll()">${icon('trash')} Clear everything</button></div></div>
  <div class="glass card"><h2 style="margin-bottom:6px">Quick start</h2><ol class="sub" style="line-height:1.9;padding-left:18px"><li>Set the start month and rate history here (when did ৳2,000 become ৳3,000?).</li><li>Members → check names, add phone numbers, photos and ID cards.</li><li>Download the Excel template, fill 2022–now, then Import Excel.</li><li>Banks & FDR → add your accounts and opening balances.</li><li>Quick Pay → record each month's collection in one click.</li><li>Assets / Expenses → log purchases and spending.</li><li>Reports → download a JSON backup regularly.</li></ol></div></div></div>`};
const rateRow=(r,i)=>`<div class="toolbar rate-row" style="margin-bottom:8px"><input type="month" class="rf" value="${r.from}" style="flex:1" required><input type="number" class="ra" value="${r.amount}" min="0" style="flex:1" required><button type="button" class="icon-btn" onclick="this.parentElement.remove()">${icon('trash')}</button></div>`;
function addRateRow(){$('#rates').insertAdjacentHTML('beforeend',rateRow({from:curMonth(),amount:rateFor(curMonth())}))}
AFTER.settings=()=>{const f=$('#sf');if(!f)return;f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);const rates=$$('.rate-row').map(r=>({from:r.querySelector('.rf').value,amount:+r.querySelector('.ra').value})).filter(r=>r.from);if(!rates.length){toast('Add at least one rate','warn');return}
    const ns={...S(),name:fd.get('name'),tagline:fd.get('tagline'),startMonth:fd.get('startMonth'),founded:fd.get('founded'),address:fd.get('address'),dueDay:Math.min(28,Math.max(1,+fd.get('dueDay')||5)),defaultDown:+fd.get('defaultDown')||0,fineEnabled:fd.get('fineEnabled')==='true',fineFrom:fd.get('fineFrom'),duesFrom:fd.get('duesFrom')||'',finePct:+fd.get('finePct')||0,fineDaily:+fd.get('fineDaily')||0,rates};
    run(async()=>{await API.settings(ns);DB.settings=ns},'Settings saved')};
  $('#pf').onsubmit=e=>{e.preventDefault();const n=$('#npw').value;if(n.length<4){toast('Too short','warn');return}run(async()=>{await API.changePw(n);adminPw=n},'Password changed')}};
async function resetStart(){if(!guard())return;if(!await confirmBox('Replace ALL data with the starting data: the 12 members, nominees and resolution, with every balance at ৳0? Download a backup first if you have entered records.','Reset'))return;const keep=S().adminPassword;run(async()=>{const d=seedData();d.settings={...S(),adminPassword:keep};await API.restore(d);DB=d},'Starting data restored')}
async function clearAll(){if(!guard())return;if(!await confirmBox('Delete ALL members, payments, banks, expenses and assets? Download a backup first!','Delete everything'))return;const keep=S().adminPassword;run(async()=>{const d=normalize({settings:{...S()}});d.settings.adminPassword=keep;await API.restore(d);DB=d},'All data cleared')}

  let t='dark';try{t=localStorage.getItem(LST)||'dark'}catch(e){}applyTheme(t);
  const tmo=setTimeout(()=>loaderMsg(IS_FB?'Still waiting for Firebase… Check the FIREBASE_CONFIG values in index.html and that Firestore is created.':'Still waiting for Google Sheets… If this does not finish, run <b>setup</b> in Apps Script, deploy a <b>New version</b>, and open this link in an Incognito window.'),20000);
  try{if(IS_FB)await fbInit();const d=await API.load();clearTimeout(tmo);if(LIVE){DB=normalize(d||{});if(!DB.members.length&&!DB.rules.length){const sd=seedData();sd.settings={...DB.settings};DB=sd;DB._unsaved=true}}else if(d&&Array.isArray(d.members)&&d.members.length)DB=normalize(d);else{DB=seedData();persist()}}catch(e){clearTimeout(tmo);DB=seedData();setTimeout(()=>toast('Could not load data from Google Sheets: '+errMsg(e),'bad'),500);if(IS_FB){loaderMsg('<b>Could not connect to Firebase:</b><br>'+esc(errMsg(e))+'<br><br>Check: FIREBASE_CONFIG in index.html, Firestore database created, and the security rules published.');return}if(IS_GAS){loaderMsg('<b>Could not load data from Google Sheets:</b><br>'+esc(errMsg(e))+'<br><br>Fix: in Apps Script run <b>setup</b> and allow access, then Deploy → Manage deployments → ✏️ → New version.');return}}
  page=(location.hash||'#overview').slice(1);if(page==='banks')page='finance';if(!TITLES[page])page='overview';render();
  const L=$('#loader');L.style.opacity='0';setTimeout(()=>L.remove(),400);
  if(DB._unsaved&&isAdmin)setTimeout(firstSetup,600);else if(LIVE&&!DB.members.length)setTimeout(()=>toast('Database is empty — log in as admin to set up the 12 members','warn'),800)})();
</script>
</body>
