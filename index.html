<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unique Twelve</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#3b5bfd">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unique-12">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="dark"]{--bg:#070b18;--b1:#3b5bfd;--b2:#a64bff;--b3:#00c2a8;--blob:.38;--card:rgba(255,255,255,.055);--modal:rgba(16,21,42,.92);--border:rgba(255,255,255,.1);--text:#e9edfb;--muted:#8d97b8;--accent:#6d8bff;--accent2:#b06bff;--on-accent:#fff;--good:#2fd47f;--warn:#ffb547;--bad:#ff5d73;--info:#38bdf8;--input:rgba(255,255,255,.06);--shadow:0 10px 40px rgba(0,0,0,.35);--blur:18px}
[data-theme="glass"]{--bg:#e6eaff;--b1:#8ea8ff;--b2:#f7a1d8;--b3:#7ee0d2;--blob:.75;--card:rgba(255,255,255,.48);--modal:rgba(255,255,255,.9);--border:rgba(255,255,255,.8);--text:#1d2340;--muted:#5d6588;--accent:#5b5bf0;--accent2:#d14fb3;--on-accent:#fff;--good:#11a35d;--warn:#d48806;--bad:#e0344f;--info:#0284c7;--input:rgba(255,255,255,.6);--shadow:0 10px 40px rgba(60,70,140,.16)}
[data-theme="royal"]{--bg:#061451;--b1:#1d4ed8;--b2:#3b2bbf;--b3:#f5c542;--blob:.4;--card:rgba(255,255,255,.07);--modal:rgba(10,28,96,.94);--border:rgba(255,255,255,.13);--text:#f1f4ff;--muted:#a4b1e3;--accent:#f5c542;--accent2:#ffa53b;--on-accent:#1a1400;--good:#3ee08f;--warn:#ffc04d;--bad:#ff6b81;--info:#7cc4ff;--input:rgba(255,255,255,.08);--shadow:0 10px 40px rgba(0,0,30,.45)}
[data-theme="emerald"]{--bg:#03140e;--b1:#0f9d6b;--b2:#045c45;--b3:#a3e635;--blob:.35;--card:rgba(255,255,255,.055);--modal:rgba(6,32,23,.94);--border:rgba(255,255,255,.1);--text:#e7fbf2;--muted:#86b3a2;--accent:#34d399;--accent2:#a3e635;--on-accent:#032016;--good:#4ade80;--warn:#fbbf24;--bad:#fb7185;--info:#67e8f9;--input:rgba(255,255,255,.06);--shadow:0 10px 40px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f3f5fa;--b1:#c7d2fe;--b2:#fbcfe8;--b3:#bae6fd;--blob:.0;--card:#ffffff;--modal:#ffffff;--border:#e3e7f0;--text:#18203a;--muted:#6b7491;--accent:#4f46e5;--accent2:#7c3aed;--on-accent:#fff;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0284c7;--input:#f6f7fb;--shadow:0 4px 18px rgba(20,30,70,.07);--blur:0px}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans','Hind Siliguri',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .5s,color .3s;font-size:14px}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;background:radial-gradient(38% 38% at 15% 20%,var(--b1),transparent 70%),radial-gradient(34% 34% at 85% 12%,var(--b2),transparent 70%),radial-gradient(40% 40% at 70% 92%,var(--b3),transparent 70%);opacity:var(--blob);filter:blur(50px);animation:drift 26s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg)}}
.glass{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);border-radius:18px;box-shadow:var(--shadow)}
.card{padding:18px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px}h2{font-size:16px;font-weight:700}h3{font-size:17px;font-weight:700}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* layout */
.side{width:252px;position:fixed;top:12px;bottom:12px;left:12px;display:flex;flex-direction:column;padding:18px 12px;z-index:60;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.brand b{font-size:16px;display:block;letter-spacing:-.2px}.brand small{color:var(--muted);font-size:11.5px}
.nav{flex:1;overflow:auto}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:12px 12px 6px;font-weight:700}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13.5px;position:relative;transition:all .2s;text-decoration:none;margin-bottom:2px}
.nav a:hover{color:var(--text);background:var(--input)}
.nav a.active{color:var(--text);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,transparent),transparent)}
.nav a.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.nav a .lk{margin-left:auto;opacity:.6}
.side-foot{border-top:1px solid var(--border);padding:12px 8px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent);margin-right:6px}
.main{margin-left:276px;padding:12px 18px 50px 0;min-width:0}
.top{position:sticky;top:12px;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:18px}
.top .ttl{flex:1;min-width:0}
.top .ttl h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.menu-btn{display:none}
.scrim{display:none}
@media(max-width:920px){.side{transform:translateX(-115%)}.side.open{transform:none}.main{margin-left:0;padding:10px 10px 50px}.icon-btn.menu-btn{display:inline-grid}.scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}.hide-sm{display:none!important}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:9px 15px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap;color:var(--text)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 55%,transparent);transform:translateY(-1px)}
.btn.ghost{background:var(--input);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.success{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:11px;display:inline-grid;place-items:center;background:var(--input);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.sm{width:30px;height:30px;border-radius:9px}.icon-btn.sm svg{width:15px;height:15px}
input,select,textarea{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
select option{background:var(--modal);color:var(--text)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--input);border:1px solid var(--border)}
.chip.admin{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-paid{background:color-mix(in srgb,var(--good) 17%,transparent);color:var(--good)}
.b-late{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-unpaid{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.b-partial{background:color-mix(in srgb,var(--info) 17%,transparent);color:var(--info)}
.b-pending,.b-future,.b-na{background:var(--input);color:var(--muted)}
.b-acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

/* grids */
.view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(5){animation-delay:.2s}.view>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.view{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.view>.kpis:has(>.kpi:nth-child(6)){grid-template-columns:repeat(6,1fr)}@media(max-width:1350px){.view>.kpis:has(>.kpi:nth-child(6)){grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.kpis,.view>.kpis:has(>.kpi:nth-child(6)){grid-template-columns:1fr 1fr}.kpi .val{font-size:18px}}
.kpi{padding:16px;position:relative;overflow:hidden;transition:transform .25s}
.kpi:hover{transform:translateY(-3px)}
.kpi .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.4px}
.kpi .ft{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c,var(--accent)) 22%,transparent),transparent 70%)}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.g11{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g111{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1150px){.g21,.g11,.g111{grid-template-columns:1fr}}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.chart-box{position:relative;height:270px}
.chart-box.sm{height:230px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:180px}
.search{position:relative}.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}.search input{padding-left:34px}
.hero{padding:22px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--card)),color-mix(in srgb,var(--accent2) 14%,var(--card)))}
.hero h1{font-size:24px}
.prog{height:9px;border-radius:9px;background:var(--input);overflow:hidden;border:1px solid var(--border)}
.prog>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr{transition:background .15s}.tbl tbody tr:hover{background:var(--input)}
.tbl .r{text-align:right}.tbl tfoot td{font-weight:800;border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;flex:none;background:var(--c)}
.av.lg{width:64px;height:64px;border-radius:20px;font-size:22px}

/* photos & files */
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.lg{width:84px;height:84px;border-radius:24px;font-size:26px}
.avwrap{position:relative;flex:none}
.cam{position:absolute;right:-8px;bottom:-8px;width:32px;height:32px;border-radius:11px;border:2px solid var(--modal);background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.cam:hover{transform:scale(1.1)}.cam svg{width:15px;height:15px}
.cam.rm{top:-8px;bottom:auto;background:var(--bad);color:#fff;width:26px;height:26px;border-radius:9px}.cam.rm svg{width:12px;height:12px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ftile{border:1px solid var(--border);background:var(--input);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;position:relative;display:block}
.ftile:hover{transform:translateY(-3px);border-color:var(--accent)}
.ftile .th{height:110px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,transparent);position:relative}
.ftile .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.ftile .th svg{width:36px;height:36px;color:var(--accent)}
.ftile .ext{position:absolute;bottom:10px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--accent)}
.ftile .nm{padding:8px 10px 2px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile .mt{padding:0 10px 9px;font-size:11px;color:var(--muted)}
.ftile .del{position:absolute;top:6px;right:6px;background:var(--modal)}
.ftile.up{border-style:dashed;border-width:2px;min-height:160px;color:var(--muted);align-items:center;justify-content:center}
.ftile.up svg{width:26px;height:26px}
.fbtn{margin-top:12px}
.preview{margin-bottom:12px}
.preview img{max-width:100%;max-height:68vh;display:block;margin:0 auto;border-radius:12px;background:#fff}
.preview iframe{width:100%;height:68vh;border:0;border-radius:12px;background:#fff}
.preview pre{white-space:pre-wrap;max-height:60vh;overflow:auto;background:var(--input);padding:16px;border-radius:12px;font-size:13px;line-height:1.6}
/* lists, lightbox, entry chooser */
.lists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.list-box{padding:12px;border-radius:13px;background:var(--input);border:1px solid var(--border)}
.chips a{color:var(--bad);text-decoration:none;font-weight:800;margin-left:3px}
.lightbox{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:20px;opacity:0;transition:opacity .25s}
.lightbox.show{opacity:1}
.lightbox img{max-width:94vw;max-height:84vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:scale(.94);transition:transform .3s}
.lightbox.show img{transform:none}
.lb-x{position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.16)!important;color:#fff!important;border-color:transparent!important}
.lb-cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-weight:700}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.entry-btn{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--input);color:var(--text);font:inherit;cursor:pointer;transition:transform .2s,border-color .2s}
.entry-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.entry-btn b{font-size:14px}.entry-btn small{color:var(--muted);font-size:12px;line-height:1.4}
/* universal search */
.gsearch{position:relative;flex:0 1 320px;min-width:130px}
.gsearch>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.gsearch input{padding-left:35px;height:38px;border-radius:12px}
.gs-pop{position:absolute;top:calc(100% + 8px);left:0;width:max(100%,380px);max-width:92vw;max-height:440px;overflow:auto;z-index:90;padding:6px;background:var(--modal);display:none}
.gs-pop.on{display:block;animation:rise .2s both}
.gs-it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:11px;cursor:pointer}
.gs-it.act,.gs-it:hover{background:var(--input)}
.gs-it .gi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.gs-it .gt{flex:1;min-width:0}.gs-it .gt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gs-it .gt small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-it .gk{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--input);border:1px solid var(--border);color:var(--muted);flex:none}
.gs-it mark{background:color-mix(in srgb,var(--warn) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.gs-empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:640px){.top .ttl{display:none}.gsearch{flex:1;min-width:0}.top{gap:6px;padding:8px 10px}.top .btn{padding:8px 10px}.gs-pop{position:fixed;left:10px;right:10px;top:72px;width:auto;max-width:none}#langBtn{padding:0 8px!important;margin-right:4px!important}}
@media(max-width:920px){body.admin .admin-only.hide-sm{display:none!important}}
/* lock screen */
.lock{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .4s both}
.lock-card{width:min(400px,100%);padding:30px 26px;background:var(--modal)}
.lock .tabs{display:flex;width:max-content}
.pwrules{font-size:12px;color:var(--muted);margin-top:6px}
/* resolution document */
.doc{padding:34px clamp(16px,5vw,56px);line-height:1.8;font-size:15px;max-width:1000px;margin:0 auto;width:100%}
.doc.bn{font-family:'Hind Siliguri','Plus Jakarta Sans',sans-serif;font-size:16.5px}
.doc-banner{text-align:center;font-weight:800;font-size:18px;border:2px solid var(--border);border-radius:16px;padding:12px 18px;max-width:560px;margin:0 auto 18px;background:var(--input)}
.doc-title{text-align:center;font-weight:800;font-size:20px;margin:24px auto 14px;padding:4px 28px;border-left:4px solid var(--accent);border-right:4px solid var(--accent);width:max-content;max-width:100%}
.doc h3{margin:20px 0 6px;font-size:16px}
.rule{display:flex;gap:10px;align-items:flex-start;padding:5px 8px;border-radius:10px;transition:background .2s}
.rule:hover{background:var(--input)}
.rule .rn{font-weight:800;min-width:28px;flex:none}
.rule .rt{flex:1;min-width:0}
.rule .rsub{padding-left:22px}
.rule .racts{gap:4px;flex:none}

function addEntry(){if(!guard())return;const opt=(fn,ic,t,d)=>`<button class="entry-btn" onclick="closeModal();setTimeout(()=>{${fn}},280)">${icon(ic)}<b>${t}</b><small>${d}</small></button>`;

const LK_IC={Expense:'receipt','Asset Purchase':'box',Transfer:'swap',Income:'trend','Loan given':'arrowOut','Loan repayment':'arrowIn'};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function ledgerList(E){if(!E.length)return'<div class="empty" style="padding:30px">No entries</div>';led.closed=led.closed||new Set();
  const groups=[];E.forEach(e=>{const k=(e.date||'').slice(0,7)||'—';let g=groups[groups.length-1];if(!g||g.k!==k)groups.push(g={k,list:[]});g.list.push(e)});

    ${rows.map(e=>{const d=e.date?new Date(e.date+'T00:00'):null,dir=e.inn?'in':e.out?'out':'mv',ic=LK_IC[e.kind]||(e.inn?'arrowIn':e.out?'arrowOut':'swap'),acc=esc(bankName(e.bankId))+(e.bankId2?' → '+esc(bankName(e.bankId2)):'');const own=e.who&&e.who!=='—',dp=(e.desc||'').split(' · '),ttl=own?e.who:(dp[0]||e.kind),rest=own?e.desc:(dp.slice(1).join(' · ')||e.kind);

/* ---- bank reconciliation ---- */
function reconForm(bankId,rec={}){if(!guard())return;const isNew=!rec.id;
  formModal(isNew?'Reconcile with the bank statement':'Edit reconciliation',[{k:'bankId',label:'Account',type:'select',options:bankOpts(),full:1},{k:'date',label:'Statement date',type:'date',req:1},{k:'statementBalance',label:'Balance shown on the bank statement (৳)',type:'number',req:1},{k:'note',label:'Note',type:'textarea',full:1}],{bankId:bankId||(DB.banks.find(b=>b.id!=='cash')||DB.banks[0]||{}).id,date:todayStr(),...rec},
  out=>{const d=(+out.statementBalance)-bankBreakdown(out.bankId,out.date).bal;return upsert('recons',out,Math.abs(d)<1?'Matched ✓ — the dashboard agrees with the bank':'Saved — difference of '+TK(d)+' to check')})}
function reconRows(list){return list.map(r=>{const dash=bankBreakdown(r.bankId,r.date).bal,d=(+r.statementBalance||0)-dash,okk=Math.abs(d)<1;return`<tr><td><b>${esc(bankName(r.bankId))}</b>${r.note?`<div class="sub">${esc(r.note)}</div>`:''}</td><td>${dLabel(r.date)}</td><td class="r">${TK(r.statementBalance)}</td><td class="r">${TK(dash)}</td><td class="r"><b class="${okk?'good':'bad'}">${okk?'—':(d>0?'+':'')+TK(d)}</b></td><td>${okk?'<span class="badge b-paid">Matched ✓</span>':`<span class="badge b-unpaid" title="${d>0?'Bank shows more: maybe interest or a deposit not recorded':'Bank shows less: maybe bank charges or a withdrawal not recorded'}">Difference</span>`}</td><td><span class="admin-only" style="gap:6px"><button class="icon-btn sm" onclick="editRec('recons','${r.id}')">${icon('edit')}</button><button class="icon-btn sm" onclick="delRec('recons','${r.id}','reconciliation')">${icon('trash')}</button></span></td></tr>`}).join('')}
function reconCard(){const L=[...DB.recons].sort((a,b)=>a.date<b.date?1:-1);return`<div class="glass card"><div class="toolbar" style="margin-bottom:10px"><div class="grow"><h2>Bank reconciliation</h2><div class="sub">Type the balance from your bank statement — the dashboard checks it against its own records on that date.</div></div><button class="btn primary admin-only" onclick="reconForm()">${icon('check')} Reconcile</button></div>

/* ---- annual report (AGM) ---- */
function fullExtras(start,end){const E=ledgerEntries(),ys=[];for(let y=+start.slice(0,4);y<=+end.slice(0,4);y++)ys.push(String(y));
  const yr=y=>{const es=E.filter(e=>e.date.startsWith(y)&&e.date>=start&&e.date<=end);return{coll:sum(es.filter(e=>e.src==='payments'),e=>e.inn),inc:sum(es.filter(e=>e.src!=='payments'),e=>e.inn),exp:sum(es.filter(e=>e.src==='expenses'),e=>e.out),ast:sum(es.filter(e=>e.src==='assets'),e=>e.out),lo:sum(es.filter(e=>e.src==='loans'),e=>e.out)}};
  const T=totals(),rows=ys.map(y=>({y,...yr(y)}));
  return`<h2>7. Year by year</h2><table><thead><tr><th>Year</th><th class="r">Member savings</th><th class="r">Other money in</th><th class="r">Expenses</th><th class="r">Assets bought</th><th class="r">Loans given</th><th class="r">Net</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.y}</b></td><td class="r g">${TK(r.coll)}</td><td class="r g">${TK(r.inc)}</td><td class="r b">${TK(r.exp)}</td><td class="r b">${TK(r.ast)}</td><td class="r b">${TK(r.lo)}</td><td class="r"><b>${TK(r.coll+r.inc-r.exp-r.ast-r.lo)}</b></td></tr>`).join('')}</tbody><tfoot><tr><th>Total</th><th class="r">${TK(sum(rows,r=>r.coll))}</th><th class="r">${TK(sum(rows,r=>r.inc))}</th><th class="r">${TK(sum(rows,r=>r.exp))}</th><th class="r">${TK(sum(rows,r=>r.ast))}</th><th class="r">${TK(sum(rows,r=>r.lo))}</th><th class="r">${TK(sum(rows,r=>r.coll+r.inc-r.exp-r.ast-r.lo))}</th></tr></tfoot></table>
  <h2>8. Position today (${dLabel(todayStr())})</h2><div class="grid"><div class="box">Total member savings<b>${TK(T.contrib)}</b></div><div class="box">Cash in all accounts<b>${TK(T.cash)}</b></div><div class="box">Assets (current value)<b>${TK(T.assetValue)}</b></div><div class="box">Net worth<b>${TK(T.netWorth)}</b></div><div class="box">Total expenses<b class="b">${TK(T.expenses)}</b></div><div class="box">Interest & income<b class="g">${TK(T.income)}</b></div><div class="box">Loans still owed<b>${TK(T.loanOwed)}</b></div><div class="box">Unpaid dues<b class="b">${TK(T.outstanding)}</b></div></div>
  <table style="margin-top:12px"><thead><tr><th>Member</th><th class="r">Total saved</th><th class="r">Share</th><th class="r">Value today</th><th class="r">Unpaid dues</th><th class="r">Fines due</th><th class="r">Loan owed</th></tr></thead><tbody>${MEM().map(m=>{const st=memberStats(m),sh=T.contrib?st.total/T.contrib:0;return`<tr><td>${esc(m.name)}</td><td class="r">${TK(st.total)}</td><td class="r">${(sh*100).toFixed(2)}%</td><td class="r">${TK(sh*T.netWorth)}</td><td class="r">${TK(st.outstanding)}</td><td class="r">${TK(st.fineBal)}</td><td class="r">${TK(memberLoan(m.id))}</td></tr>`}).join('')}</tbody></table>`}
function fullReportPick(){const from=S().founded||S().startMonth+'-01';openModal('Full financial report',`<div class="sub" style="margin-bottom:12px;line-height:1.6">All savings, collections, income, expenses, assets, loans and balances — from the start of the samity to today, or any period you choose. Opens in a new tab ready to print or save as PDF.</div><div class="form-grid"><label class="fld"><span>From</span><input type="date" id="frF" value="${from}"></label><label class="fld"><span>To</span><input type="date" id="frT" value="${todayStr()}"></label></div><div class="modal-actions"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="frGo">${icon('book')} Create report</button></div>`,{after:b=>{b.querySelector('[data-x]').onclick=()=>closeModal();b.querySelector('#frGo').onclick=()=>{const f=b.querySelector('#frF').value,t=b.querySelector('#frT').value;if(!f||!t||f>t){toast('Choose a valid period','warn');return}closeModal();annualReport(f.slice(0,4),f,t)}}})}
function annualPick(){const ys=yearsList();openModal('Annual report for the AGM',`<div class="sub" style="margin-bottom:12px">Choose the year. The report opens in a new tab, ready to print or save as PDF.</div><div class="yrs">${ys.map(y=>`<button class="ychip" onclick="closeModal();annualReport(${y})">${y}</button>`).join('')}</div>`)}
function annualReport(y,from,to){const Y=String(y||''),start=from||Y+'-01-01',end=to||Y+'-12-31',RT=from?'Financial Report · '+dLabel(start)+' – '+dLabel(end):'Annual Report '+Y,PL=from?'this period':Y,E=ledgerEntries(),inY=e=>e.date>=start&&e.date<=end,e_=esc;
  const openBal=sum(DB.banks,b=>(!b.openDate||b.openDate<start)?+b.openingBalance||0:0)+sum(E.filter(e=>e.date<start),e=>e.inn-e.out)+sum(DB.banks.filter(b=>b.openDate&&b.openDate>=start&&b.openDate<=end),b=>+b.openingBalance||0);
  const P=DB.payments.filter(p=>p.date>=start&&p.date<=end),grp=(arr,k,v)=>{const o={};arr.forEach(x=>{o[k(x)]=(o[k(x)]||0)+(+v(x)||0)});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  const inc=DB.income.filter(i=>i.date>=start&&i.date<=end),exp=DB.expenses.filter(x=>x.date>=start&&x.date<=end),buy=DB.assets.filter(a=>a.date>=start&&a.date<=end),sold=DB.assets.filter(a=>a.status==='Sold'&&(a.saleDate||a.date)>=start&&(a.saleDate||a.date)<=end),ln=DB.loans.filter(l=>l.date>=start&&l.date<=end),lr=DB.loanPayments.filter(x=>x.date>=start&&x.date<=end);
  const tin=sum(E.filter(inY),e=>e.inn),tout=sum(E.filter(inY),e=>e.out),close=openBal+tin-tout;
  const row=(l,v,c='')=>`<tr><td>${e_(l)}</td><td class="r ${c}">${TK(v)}</td></tr>`;
  const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${e_(S().name)} – ${RT}</title><style>body{font-family:Segoe UI,Arial,sans-serif;color:#111;margin:32px;max-width:960px}h1{margin:0;font-size:24px}h2{font-size:16px;margin:26px 0 8px;border-bottom:2px solid #333;padding-bottom:4px}.sub{color:#555;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#f1f3f8}.r{text-align:right}.g{color:#0a7a3e}.b{color:#b42318}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{border:1px solid #ccc;border-radius:8px;padding:10px}.box b{display:block;font-size:18px;margin-top:2px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.sign{display:flex;justify-content:space-between;margin-top:70px}.sign div{border-top:1px solid #333;width:200px;text-align:center;padding-top:4px;font-size:12px}button{padding:8px 16px;margin-bottom:16px}@media print{button{display:none}body{margin:12mm}}</style></head><body>
  <button onclick="print()">Print / Save as PDF</button><h1>${e_(S().name)} — ${RT}</h1><div class="sub">${e_(S().address||'')} · ${DB.members.length} members · Prepared ${dLabel(todayStr())} ${from?'· full statement of savings, funds and costs':'for the Annual General Meeting'}</div>
  <h2>1. Summary</h2><div class="grid"><div class="box">Fund on ${dLabel(start)}<b>${TK(openBal)}</b></div><div class="box">Money in during ${PL}<b class="g">${TK(tin)}</b></div><div class="box">Money out during ${PL}<b class="b">${TK(tout)}</b></div><div class="box">Fund on ${dLabel(end)}<b>${TK(close)}</b></div></div>
  <div class="two"><div><h2>2. Money in</h2><table>${row('Monthly contributions',sum(P.filter(isMon),p=>p.amount),'g')}${row('Down payments',sum(P.filter(p=>p.type==='Down Payment'),p=>p.amount),'g')}${row('Other collections',sum(P.filter(isOther),p=>p.amount),'g')}${row('Late fines',sum(P.filter(p=>p.type==='Fine'),p=>p.amount),'g')}${grp(inc,x=>x.category,x=>x.amount).map(([k,v])=>row(k,v,'g')).join('')}${row('Asset sales',sum(sold,a=>a.saleAmount),'g')}${row('Loan repayments',sum(lr,x=>x.amount),'g')}<tr><th>Total</th><th class="r">${TK(tin)}</th></tr></table></div>
  <div><h2>3. Money out</h2><table>${grp(exp,x=>x.category,x=>x.amount).map(([k,v])=>row(k,v,'b')).join('')||'<tr><td colspan="2">No expenses</td></tr>'}${row('Asset purchases',sum(buy,a=>a.cost),'b')}${row('Loans given to members',sum(ln,l=>l.amount),'b')}<tr><th>Total</th><th class="r">${TK(tout)}</th></tr></table></div></div>
  <h2>4. Member contributions in ${PL}</h2><table><thead><tr><th>No.</th><th>Member</th><th class="r">Monthly</th><th class="r">Down</th><th class="r">Other</th><th class="r">Fines</th><th class="r">Total ${PL}</th><th class="r">Months paid</th><th class="r">Total since start</th></tr></thead><tbody>${MEM().map(m=>{const ps=P.filter(p=>p.memberId===m.id),mp=new Set(ps.filter(isMon).map(p=>p.month)).size;return`<tr><td>${e_(m.memberNo||'')}</td><td>${e_(m.name)}</td><td class="r">${TK(sum(ps.filter(isMon),p=>p.amount))}</td><td class="r">${TK(sum(ps.filter(p=>p.type==='Down Payment'),p=>p.amount))}</td><td class="r">${TK(sum(ps.filter(isOther),p=>p.amount))}</td><td class="r">${TK(sum(ps.filter(p=>p.type==='Fine'),p=>p.amount))}</td><td class="r"><b>${TK(sum(ps,p=>p.amount))}</b></td><td class="r">${mp}</td><td class="r">${TK(memberStats(m).total)}</td></tr>`}).join('')}</tbody><tfoot><tr><th colspan="6">Total</th><th class="r">${TK(sum(P,p=>p.amount))}</th><th></th><th></th></tr></tfoot></table>

  const w=window.open('','_blank');if(!w){toast('Allow pop-ups to open the report','warn');return}w.document.open();w.document.write(html);w.document.close()}

let cbY=+todayStr().slice(0,4);
function cashBook(){const ys=yearsList();if(!ys.includes(cbY))cbY=ys[ys.length-1];const E=ledgerEntries(),first=S().startMonth;

  return`<div class="glass card"><div class="toolbar" style="justify-content:space-between;margin-bottom:12px"><div><h2>Monthly cash book</h2><div class="sub">Opening balance, money in, money out and closing balance for every month</div></div><div class="yrs" style="margin:0">${ys.map(y=>`<button class="ychip ${y===cbY?'on':''}" onclick="cbY=${y};render()">${y}</button>`).join('')}</div></div>

  openModal('Backup account created',`<p style="line-height:1.7">Copy this password now — it is shown only once.</p><div style="display:flex;gap:8px;margin:12px 0"><input id="bkpw" value="${pw}" readonly style="font-family:monospace;font-weight:700"><button class="btn primary" onclick="const i=document.getElementById('bkpw');i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand('copy')}toast('Copied')">Copy</button></div><ol class="sub" style="line-height:1.9;padding-left:18px"><li>Open your private repo <b>Unique-12-backups</b> on GitHub.</li><li>Settings → Secrets and variables → Actions → <b>New repository secret</b>.</li><li>Name: <b>BACKUP_PASSWORD</b> · Secret: paste this password → Add secret.</li></ol>`)}

async function clearAll(){if(!guard())return;if(!await confirmTyped('Delete <b>EVERYTHING</b> — all members, payments, banks, FDRs, expenses, assets, resolution and files?'))return;backupJSON();const keep=S().adminPassword;run(async()=>{const d=normalize({settings:{...S()}});d.settings.adminPassword=keep;await replaceAll(d,'All data cleared')},'All data cleared')}

function gsRun(q){q=q.trim().toLowerCase();if(!q)return[];const terms=q.split(/\s+/),W={Page:16,Member:14,Tool:10,Account:9,Loan:6,Document:5};
  return searchIndex().filter(x=>terms.every(t=>x.hay.includes(t))).map(x=>{const lab=x.label.toLowerCase();return{...x,sc:(lab===q?100:0)+(lab.startsWith(q)?50:0)+(lab.includes(q)?20:0)+(W[x.type]||0)}}).sort((a,b)=>b.sc-a.sc).slice(0,12)}
function gsMark(t,q){t=esc(t);q.trim().split(/\s+/).filter(Boolean).forEach(w=>{const i=t.toLowerCase().indexOf(w.toLowerCase());if(i>=0&&w.length>0)t=t.slice(0,i)+'<mark>'+t.slice(i,i+w.length)+'</mark>'+t.slice(i+w.length)});return t}
function gsDraw(){const q=$('#gsq').value,p=$('#gspop');if(!q.trim()){p.classList.remove('on');return}
  p.innerHTML=gsList.length?gsList.map((x,i)=>`<div class="gs-it ${i===gsAct?'act':''}" onmousedown="event.preventDefault();gsGo(${i})"><div class="gi">${icon(x.ic||'search')}</div><div class="gt"><b>${gsMark(x.label,q)}</b>${x.sub?`<small>${gsMark(x.sub,q)}</small>`:''}</div><span class="gk">${x.type}</span></div>`).join(''):`<div class="gs-empty">Nothing found for “${esc(q)}”</div>`;
  p.classList.add('on');trNode(p)}
function gsGo(i){const x=gsList[i];if(!x)return;const inp=$('#gsq');inp.value='';inp.blur();$('#gspop').classList.remove('on');while(modals.length)closeModal();setTimeout(()=>x.fn(),modals.length?300:0)}
function gsInit(){const inp=$('#gsq');if(!inp)return;
  inp.addEventListener('input',()=>{gsList=gsRun(inp.value);gsAct=0;gsDraw()});
  inp.addEventListener('focus',()=>{if(inp.value.trim()){gsList=gsRun(inp.value);gsDraw()}});
  inp.addEventListener('blur',()=>setTimeout(()=>$('#gspop').classList.remove('on'),150));
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();gsAct=Math.min(gsList.length-1,gsAct+1);gsDraw()}else if(e.key==='ArrowUp'){e.preventDefault();gsAct=Math.max(0,gsAct-1);gsDraw()}else if(e.key==='Enter'){e.preventDefault();gsGo(gsAct)}else if(e.key==='Escape'){e.stopPropagation();inp.value='';inp.blur();$('#gspop').classList.remove('on')}});
  document.addEventListener('keydown',e=>{const t=e.target;if(((e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName))||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))&&!document.getElementById('lock')){e.preventDefault();inp.focus();inp.select()}})}

const BN_ATTR={'Send SMS reminder (from your own phone)':'এসএমএস রিমাইন্ডার পাঠান','Search anything…  ( / )':'যেকোনো কিছু খুঁজুন…  ( / )','Search members…':'সদস্য খুঁজুন…','Search ledger…':'খতিয়ানে খুঁজুন…','Add new…':'নতুন যোগ করুন…'};
function trNode(root){if(LANG!=='bn'||!root)return;if(root.nodeType===3){const t=root.nodeValue,k=t.trim();if(k&&BN[k]&&!(root.parentNode&&root.parentNode.closest&&root.parentNode.closest('textarea,.doc,script,style')))root.nodeValue=t.replace(k,BN[k]);return}
  if(root.nodeType!==1||root.closest('textarea,.doc,script,style'))return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest('textarea,.doc,script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;while((n=w.nextNode())){const t=n.nodeValue,k=t.trim();if(k&&k.length<90&&BN[k])n.nodeValue=t.replace(k,BN[k])}
  root.querySelectorAll('[placeholder],[title]').forEach(e=>['placeholder','title'].forEach(a=>{const v=e.getAttribute(a);if(v&&(BN_ATTR[v]||BN[v]))e.setAttribute(a,BN_ATTR[v]||BN[v])}))}
function startLang(){document.documentElement.lang=LANG==='bn'?'bn':'en';if(LANG!=='bn')return;trNode(document.body);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trNode))).observe(document.body,{childList:true,subtree:true})}
function toggleLang(){LANG=LANG==='bn'?'en':'bn';try{localStorage.setItem('u12lang',LANG)}catch(e){}location.reload()}

/* ================= INIT ================= */
function loaderMsg(html){const L=document.getElementById('loader');if(!L)return;let m=L.querySelector('.lmsg');if(!m){m=document.createElement('div');m.className='lmsg';m.style.cssText='max-width:520px;margin:18px auto 0;padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.6;background:rgba(255,93,115,.12);border:1px solid rgba(255,93,115,.35);text-align:left';L.firstElementChild.appendChild(m)}m.innerHTML=html}
window.addEventListener('error',e=>loaderMsg('<b>Error:</b> '+esc(e.message||'Unknown error')));
(async function init(){
  $('.menu-btn').innerHTML=icon('menu');$('#themeBtn').innerHTML=icon('palette');$('#gsIcon').outerHTML=icon('search');gsInit();$('#langBtn').textContent=LANG==='bn'?'EN':'বাংলা';startLang();$('#loginBtn').innerHTML=icon('lock')+'<span class="hide-sm">Admin Login</span>';$('#logoutBtn').innerHTML=icon('logout')+'<span class="hide-sm">Logout</span>';$('#adminChip').innerHTML=icon('unlock')+' Admin';$('#viewChip').innerHTML=icon('eye')+' Member view';
  let t='dark';try{t=localStorage.getItem(LST)||'dark'}catch(e){}applyTheme(t);
  const tmo=setTimeout(()=>loaderMsg(IS_FB?'Still waiting for Firebase… Check the FIREBASE_CONFIG values in index.html and that Firestore is created.':'Still waiting for Google Sheets… If this does not finish, run <b>setup</b> in Apps Script, deploy a <b>New version</b>, and open this link in an Incognito window.'),20000);
  try{if(IS_FB){await fbInit();$('#lockBtn').innerHTML=icon('lock');$('#lockBtn').style.display='';if(!fbRole){clearTimeout(tmo);$('#loader').style.display='none';await lockScreen();$('#loader').style.display=''}}const d=await API.load();clearTimeout(tmo);if(LIVE){DB=normalize(d||{});if(!DB.members.length&&!DB.rules.length){const sd=seedData();sd.settings={...DB.settings};DB=sd;DB._unsaved=true}}else if(d&&Array.isArray(d.members)&&d.members.length)DB=normalize(d);else{DB=seedData();persist()}}catch(e){clearTimeout(tmo);DB=seedData();setTimeout(()=>toast('Could not load data from Google Sheets: '+errMsg(e),'bad'),500);if(IS_FB){loaderMsg('<b>Could not connect to Firebase:</b><br>'+esc(errMsg(e))+'<br><br>Check: FIREBASE_CONFIG in index.html, Firestore database created, and the security rules published.');return}if(IS_GAS){loaderMsg('<b>Could not load data from Google Sheets:</b><br>'+esc(errMsg(e))+'<br><br>Fix: in Apps Script run <b>setup</b> and allow access, then Deploy → Manage deployments → ✏️ → New version.');return}}
  page=(location.hash||'#overview').slice(1);if(page==='banks')page='finance';if(!TITLES[page])page='overview';render();
  const L=$('#loader');L.style.opacity='0';setTimeout(()=>L.remove(),400);
  if(DB._unsaved&&isAdmin)setTimeout(firstSetup,600);else if(LIVE&&!DB.members.length)setTimeout(()=>toast('Database is empty — log in as admin to set up the 12 members','warn'),800)})();
</script>
